<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>S3 W01｜GAMMA答題版 MVP</title>
  <style>
    :root {
      --bg: #07110f;
      --panel: #0d1c18;
      --panel-2: #122823;
      --line: #2f665b;
      --line-soft: rgba(98, 211, 181, 0.28);
      --text: #e4fff7;
      --muted: #90c8ba;
      --accent: #62d3b5;
      --coin-bg: rgba(245, 247, 250, 0.12);
      --coin-border: rgba(245, 247, 250, 0.56);
      --coin-text: #f8fafc;
      --paper: #f7fbff;
      --paper-text: #10231f;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
      font-size: 16px;
      letter-spacing: 0;
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    .shell {
      width: min(1500px, calc(100% - 20px));
      height: 100vh;
      min-height: 0;
      margin: 0 auto;
      padding: 6px 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      flex: 0 0 auto;
      min-height: 28px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) clamp(500px, 29vw, 560px);
      gap: 8px;
      align-items: center;
      padding: 4px 8px;
      border: 1px solid var(--line-soft);
      background: rgba(13, 28, 24, 0.94);
    }

    .brand {
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: nowrap;
    }

    .brand h1 {
      margin: 0;
      color: var(--text);
      font-size: 16px;
      font-weight: 700;
      line-height: 1.1;
      white-space: nowrap;
    }

    .brand span {
      min-width: 0;
      color: var(--muted);
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .prototype-label {
      justify-self: end;
      border: 1px solid var(--line-soft);
      padding: 2px 7px;
      background: rgba(98, 211, 181, 0.08);
      color: var(--accent);
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
    }

    .topbar-actions {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 24px;
      padding: 3px 9px;
      border: 1px solid var(--accent);
      background: rgba(98, 211, 181, 0.18);
      color: var(--text);
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
    }

    .home-link:hover {
      background: var(--accent);
      color: var(--bg);
    }

    .workspace {
      flex: 1;
      min-height: 0;
      margin-top: 6px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) clamp(500px, 29vw, 560px);
      gap: 8px;
    }

    .gamma-pane,
    .lab-pane {
      min-width: 0;
      min-height: 0;
      height: 100%;
      border: 1px solid var(--line-soft);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .pane-head {
      flex: 0 0 auto;
      min-height: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 5px 9px;
      border-bottom: 1px solid var(--line-soft);
    }

    .pane-head strong {
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
    }

    .pane-head span {
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    .gamma-frame-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
      background: var(--paper);
    }

    .gamma-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: var(--paper);
    }

    .lab-body {
      flex: 1;
      min-height: 0;
      padding: clamp(6px, 1vh, 8px);
      display: grid;
      grid-template-rows: auto auto auto minmax(96px, 1fr) auto auto auto auto;
      gap: clamp(5px, .8vh, 7px);
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-gutter: stable;
    }

    .lab-body > * {
      min-width: 0;
      max-width: 100%;
    }

    .tool-switcher {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
    }

    .tool-mode-btn {
      min-height: 34px;
      border: 1px solid var(--line);
      background: rgba(98, 211, 181, 0.07);
      color: var(--muted);
      padding: 4px 5px;
      cursor: pointer;
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tool-mode-btn:hover,
    .tool-mode-btn.active {
      border-color: var(--accent);
      background: rgba(98, 211, 181, 0.18);
      color: var(--text);
    }

    .locator {
      flex: 0 0 auto;
      border: 1px solid var(--line-soft);
      background: rgba(98, 211, 181, 0.07);
      padding: 7px;
    }

    .locator-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 5px;
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
    }

    .locator-title span {
      color: var(--accent);
      font-size: 13px;
      white-space: nowrap;
    }

    .question-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
    }

    .tab-btn {
      min-height: 34px;
      border: 1px solid var(--line);
      background: rgba(7, 17, 15, 0.42);
      color: var(--muted);
      cursor: pointer;
      font-size: 15px;
      padding: 3px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .tab-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .tab-btn.active {
      border-color: var(--accent);
      background: var(--accent);
      color: #031310;
      font-weight: 700;
    }

    .tab-btn.done {
      border-color: rgba(255, 211, 92, 0.88);
      color: #ffe684;
      background: rgba(255, 211, 92, 0.1);
      box-shadow: 0 0 14px rgba(255, 211, 92, 0.18);
    }

    .tab-btn.active.done {
      color: #031310;
      background: linear-gradient(90deg, #ffd35c, #65f4d8);
      box-shadow: 0 0 18px rgba(255, 211, 92, 0.28);
    }

    .tab-btn.done::after {
      content: "★";
      display: inline-block;
      color: #ffd35c;
      font-size: 12px;
      line-height: 1;
      text-shadow: 0 0 8px rgba(255, 211, 92, 0.78);
    }

    .question-card {
      flex: 0 0 auto;
      border: 1px solid var(--line-soft);
      background: var(--panel-2);
      padding: 7px 8px;
    }

    .question-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }

    .question-meta span {
      color: var(--muted);
      font-size: 10px;
    }

    .coins {
      color: var(--coin-text);
      background: var(--coin-bg);
      border: 1px solid var(--coin-border);
      padding: 2px 8px;
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
      text-shadow: none;
      letter-spacing: 0;
    }

    .question-card h2 {
      margin: 0 0 4px;
      color: #65f4d8;
      font-size: 18px;
      line-height: 1.25;
      text-shadow:
        0 0 10px rgba(101, 244, 216, 0.58),
        0 0 22px rgba(101, 244, 216, 0.22);
    }

    .question-card p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.42;
    }

    .page-hint {
      margin-top: 5px;
      color: var(--accent);
      font-size: 13px;
      line-height: 1.35;
      font-weight: 700;
    }

    .answer-input {
      min-height: clamp(96px, 24vh, 270px);
      height: 100%;
      max-width: 100%;
      width: 100%;
      resize: none;
      overflow-x: hidden;
      overflow-y: auto;
      border: 1px solid var(--line);
      background: rgba(7, 17, 15, 0.72);
      color: var(--text);
      padding: 10px;
      outline: none;
      line-height: 1.55;
      font-size: 17px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .answer-input[hidden],
    .attachment-panel[hidden] {
      display: none;
    }

    .answer-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(98, 211, 181, 0.16);
    }

    .attachment-panel {
      flex: 0 0 auto;
      min-height: 0;
      border: 1px solid var(--line-soft);
      background: rgba(7, 17, 15, 0.42);
      padding: 7px;
      display: grid;
      gap: 6px;
    }

    .attachment-panel.drag-over {
      border-color: var(--accent);
      background: rgba(98, 211, 181, 0.11);
    }

    .attachment-panel.upload-success {
      border-color: rgba(56, 255, 140, 0.92);
      background: rgba(56, 255, 140, 0.11);
      box-shadow: 0 0 0 3px rgba(56, 255, 140, 0.12), 0 0 22px rgba(56, 255, 140, 0.22);
    }

    .attachment-head {
      display: flex;
      align-items: stretch;
      justify-content: space-between;
      gap: 8px;
    }

    .attachment-title {
      display: flex;
      align-items: baseline;
      gap: 6px;
      min-width: 0;
    }

    .attachment-title strong {
      color: var(--text);
      font-size: 15px;
      white-space: nowrap;
    }

    .attachment-title span,
    .upload-note {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .file-upload-btn,
    .attachment-remove {
      border: 1px solid var(--line);
      background: rgba(98, 211, 181, 0.08);
      color: var(--text);
      cursor: pointer;
      font-size: 14px;
    }

    .file-upload-btn {
      min-height: 54px;
      min-width: min(230px, 52%);
      padding: 8px 12px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      white-space: normal;
      text-align: left;
      border-color: rgba(255, 211, 92, 0.72);
      background:
        linear-gradient(135deg, rgba(255, 211, 92, 0.2), rgba(98, 211, 181, 0.14)),
        rgba(7, 17, 15, 0.82);
      box-shadow: 0 0 18px rgba(255, 211, 92, 0.12);
    }

    .upload-plus {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 211, 92, 0.82);
      background: rgba(255, 211, 92, 0.16);
      color: #ffe684;
      font-size: 22px;
      font-weight: 900;
      line-height: 1;
      box-shadow: 0 0 16px rgba(255, 211, 92, 0.24);
    }

    .upload-copy {
      min-width: 0;
      display: grid;
      gap: 1px;
    }

    .upload-copy strong,
    .upload-copy small {
      overflow-wrap: anywhere;
    }

    .upload-copy strong {
      color: #fff8d7;
      font-size: 15px;
      line-height: 1.2;
    }

    .upload-copy small {
      color: #9ee9ff;
      font-size: 12px;
      line-height: 1.25;
    }

    .file-upload-btn:hover,
    .attachment-remove:hover {
      border-color: var(--accent);
      background: rgba(98, 211, 181, 0.16);
    }

    .attachment-list {
      display: grid;
      gap: 5px;
      max-height: clamp(52px, 14vh, 138px);
      overflow: auto;
      padding-right: 2px;
    }

    .attachment-empty {
      border: 1px dashed var(--line);
      color: var(--muted);
      padding: 7px;
      font-size: 13px;
      text-align: center;
      background: rgba(98, 211, 181, 0.04);
    }

    .attachment-item {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 7px;
      align-items: start;
      border: 1px solid rgba(98, 211, 181, 0.22);
      background: rgba(13, 28, 24, 0.74);
      padding: 6px;
    }

    .type-chip {
      min-width: 36px;
      border: 1px solid var(--line);
      color: var(--accent);
      background: rgba(98, 211, 181, 0.08);
      padding: 2px 4px;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.2;
    }

    .attachment-main {
      min-width: 0;
      display: grid;
      gap: 4px;
    }

    .attachment-name {
      color: var(--text);
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .attachment-meta {
      color: var(--muted);
      font-size: 12px;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .attachment-preview {
      max-width: 100%;
      max-height: 54px;
      border: 1px solid rgba(98, 211, 181, 0.22);
      background: #06100e;
    }

    .attachment-preview.audio {
      width: 100%;
      height: 30px;
    }

    .attachment-remove {
      width: 26px;
      height: 24px;
      padding: 0;
      line-height: 1;
    }

    .field-row {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 6px;
    }

    .tool-btn {
      min-height: 30px;
      border: 1px solid var(--line);
      background: rgba(98, 211, 181, 0.09);
      color: var(--text);
      padding: 6px 8px;
      cursor: pointer;
      text-align: center;
      font-size: 14px;
    }

    .tool-btn:hover {
      border-color: var(--accent);
      background: rgba(98, 211, 181, 0.16);
    }

    .review-action {
      min-height: 56px;
      border: 2px solid rgba(255, 211, 92, 0.95);
      background:
        linear-gradient(90deg, #ffd35c, #65f4d8 52%, #4dc9ff),
        #ffd35c;
      color: #04100e;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0;
      box-shadow:
        0 0 0 3px rgba(255, 211, 92, 0.12),
        0 0 24px rgba(255, 211, 92, 0.38),
        0 0 32px rgba(77, 201, 255, 0.22);
    }

    .review-action:hover {
      border-color: #fff8d7;
      background:
        linear-gradient(90deg, #ffe684, #78ffe5 52%, #70d8ff),
        #ffe684;
      box-shadow:
        0 0 0 4px rgba(255, 211, 92, 0.16),
        0 0 30px rgba(255, 211, 92, 0.48),
        0 0 42px rgba(77, 201, 255, 0.32);
    }

    .review-action.is-complete,
    .review-action.is-complete:hover,
    .review-action:disabled {
      border-color: rgba(255, 211, 92, 0.36);
      background: rgba(255, 211, 92, 0.08);
      color: #ffe684;
      cursor: default;
      box-shadow: none;
      text-shadow: 0 0 10px rgba(255, 211, 92, 0.52);
    }

    .ai-box {
      flex: 0 0 auto;
      min-height: 38px;
      border: 1px dashed var(--line);
      padding: 7px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
      background: rgba(7, 17, 15, 0.38);
      overflow: auto;
    }

    .answer-status {
      flex: 0 0 auto;
      display: grid;
      gap: 4px;
      border: 1px solid var(--line-soft);
      background: rgba(7, 17, 15, 0.38);
      padding: 7px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.3;
    }

    .meter {
      height: 5px;
      background: rgba(98, 211, 181, 0.12);
      overflow: hidden;
    }

    .meter-fill {
      height: 100%;
      width: 0;
      background: var(--accent);
      transition: width 180ms ease;
    }

    .completion-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(0, 244, 255, 0.22), transparent 28%),
        radial-gradient(circle at 82% 14%, rgba(255, 77, 216, 0.2), transparent 26%),
        rgba(3, 7, 18, 0.88);
    }

    .completion-overlay[hidden] {
      display: none;
    }

    .cyber-confetti {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .question-confetti {
      position: fixed;
      inset: 0;
      z-index: 1001;
      overflow: hidden;
      pointer-events: none;
    }

    .confetti-piece {
      position: absolute;
      top: -24px;
      width: 8px;
      height: 20px;
      background: var(--piece-color, #65f4d8);
      box-shadow: 0 0 16px var(--piece-color, #65f4d8);
      transform: translateY(-20px) rotate(0deg);
      animation: cyberFall var(--fall-time, 1.8s) linear forwards;
    }

    .completion-modal {
      position: relative;
      width: min(560px, 100%);
      border: 2px solid rgba(101, 244, 216, 0.86);
      background:
        linear-gradient(180deg, rgba(16, 24, 48, 0.98), rgba(5, 12, 24, 0.98)),
        #06100e;
      padding: clamp(22px, 4vw, 34px);
      color: #f8ffff;
      text-align: center;
      box-shadow:
        0 0 0 4px rgba(255, 77, 216, 0.18),
        0 0 42px rgba(101, 244, 216, 0.36),
        inset 0 0 26px rgba(67, 121, 255, 0.22);
      animation: modalPop 360ms ease-out;
    }

    .completion-modal::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(255, 211, 92, 0.38);
      pointer-events: none;
    }

    .completion-modal h2 {
      margin: 0 0 10px;
      color: #65f4d8;
      font-size: clamp(26px, 5vw, 44px);
      line-height: 1.1;
      text-shadow:
        0 0 8px rgba(101, 244, 216, 0.82),
        0 0 24px rgba(255, 77, 216, 0.5);
    }

    .completion-modal p {
      margin: 0 auto 18px;
      max-width: 15em;
      color: #fff8d7;
      font-size: clamp(18px, 3.2vw, 26px);
      font-weight: 800;
      line-height: 1.35;
      text-shadow:
        0 0 9px rgba(255, 211, 92, 0.72),
        0 0 22px rgba(0, 244, 255, 0.4);
    }

    .completion-close {
      min-height: 44px;
      border: 1px solid rgba(255, 211, 92, 0.88);
      background: linear-gradient(90deg, #ffd35c, #65f4d8);
      color: #04100e;
      padding: 10px 18px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 900;
      box-shadow: 0 0 20px rgba(255, 211, 92, 0.28);
    }

    @keyframes cyberFall {
      0% {
        opacity: 0;
        transform: translate3d(0, -24px, 0) rotate(0deg);
      }
      12% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate3d(var(--fall-drift, 36px), 112vh, 0) rotate(var(--fall-rotate, 420deg));
      }
    }

    @keyframes modalPop {
      0% {
        opacity: 0;
        transform: scale(0.88) translateY(18px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .confetti-piece,
      .completion-modal {
        animation: none;
      }
    }

    @media (max-height: 760px) and (min-width: 981px) {
      .shell {
        padding: 4px 0;
      }

      .topbar,
      .pane-head {
        min-height: 24px;
        padding: 3px 7px;
      }

      .lab-body {
        padding: 6px;
        gap: 4px;
      }

      .question-card,
      .attachment-panel,
      .answer-status {
        padding: 5px 6px;
      }

      .page-hint,
      .upload-note,
      .answer-status {
        font-size: 12px;
        line-height: 1.25;
      }

      .answer-input {
        min-height: 88px;
        padding: 7px;
        font-size: 15px;
      }

      .attachment-list {
        max-height: 72px;
      }

      .tool-btn,
      .tool-mode-btn,
      .tab-btn {
        min-height: 26px;
        padding: 3px 5px;
      }

      .review-action {
        min-height: 44px;
        font-size: 15px;
      }

      .file-upload-btn {
        min-height: 42px;
        padding: 6px 9px;
      }

      .upload-plus {
        width: 26px;
        height: 26px;
        font-size: 18px;
      }

      .upload-copy small {
        font-size: 12px;
      }

      .ai-box {
        min-height: 32px;
        padding: 5px 6px;
      }
    }

    @media (max-height: 660px) and (min-width: 981px) {
      .brand h1,
      .question-card h2 {
        font-size: 15px;
      }

      .brand span,
      .pane-head strong,
      .locator-title,
      .answer-input {
        font-size: 13px;
      }

      .tool-btn {
        font-size: 12px;
      }

      .review-action {
        min-height: 38px;
        font-size: 13px;
      }

      .question-card p,
      .page-hint,
      .attachment-title span,
      .upload-note,
      .attachment-meta,
      .ai-box,
      .answer-status {
        font-size: 12px;
      }

      .lab-body {
        grid-template-rows: auto auto auto minmax(72px, 1fr) auto auto auto auto;
        gap: 3px;
      }

      .answer-input {
        min-height: 72px;
        line-height: 1.35;

        const keys = [];
        for (let index = 0; index < localStorage.length; index += 1) {

          if (

            !key.startsWith(currentPrefix)

            keys.push(key);

      } catch {

      try {

      if (/^(data|blob):/i.test(value)) return "";

        kind: String(file?.kind || "file"),
        storagePath: String(file?.storagePath || ""),
        downloadUrl: safeFirestoreUrl(file?.downloadUrl),
        source: String(file?.source || "upload"),
        toolId: String(file?.toolId || ""),
        pendingUpload: file?.pendingUpload !== false
      };
    }

        id: String(file.id || ("restored_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8))),
        name: String(file.name || "saved-file"),
        type: String(file.type || ""),
        size: Number.isFinite(Number(file.size)) ? Number(file.size) : 0,
        kind: String(file.kind || "file"),
        storagePath: String(file.storagePath || ""),
        downloadUrl: safeFirestoreUrl(file.downloadUrl),
        source: String(file.source || "firestore"),
        toolId: String(file.toolId || ""),
        pendingUpload: file.pendingUpload !== false
      };
    }

    function restoreFirestoreDraft(draft) {
      const byId = new Map((draft.questions || []).map((item) => [item.id, item]));
      questions.forEach((q) => {
        const saved = byId.get(q.id);
        if (!saved) return;
        localStorage.setItem(storageKey(q.id), q.expectedKind === "text" ? String(saved.text || "") : "");
        const attachments = (Array.isArray(saved.attachments) ? saved.attachments : [])
          .map(hydrateAttachmentFromFirestore)
          .filter(Boolean);
        localStorage.setItem(fileStorageKey(q.id), JSON.stringify(attachments));
        if (saved.review) {
          localStorage.setItem(reviewStorageKey(q.id), JSON.stringify(saved.review));
        } else {
          localStorage.removeItem(reviewStorageKey(q.id));
        }
        attachmentState.delete(attachmentStateKey(q.id));
      });
      try {
        localStorage.setItem(draftMetaStorageKey(), JSON.stringify({
          updatedAt: draft.savedAt || draft.exportedAt || new Date().toISOString(),
          reason: "firestore-load"
        }));
      } catch {
        // Local storage can be unavailable in restricted browser modes.
      }
    }

    async function saveFirestoreDraft(reason) {
      clearTimeout(firestoreSaveTimer);
      const ref = firestoreProgressRef();
      if (!ref) return false;
      if (firestoreSaveInFlight) {
        firestoreQueuedReason = reason || firestoreQueuedReason || "queued autosave";
        return false;
      }
      firestoreSaveInFlight = true;
      try {
        await withTimeout(
          ref.set(buildFirestoreDraft(reason), { merge: true }),
          FIRESTORE_SAVE_TIMEOUT_MS,
          "Firestore save timeout"
        );
        saveState.textContent = "已存到 Firestore：" + (reason || "自動儲存") + "。";
        emitIntegrationEvent("firestoreSave", {
          worksheetId: WORKSHEET_ID,
          reason: reason || "autosave",
          state: exportState()
        });
        return true;
      } catch (error) {
        console.warn("[S3W01] Firestore save failed", error);
        saveState.textContent = "Firestore 暫時無法存檔，已保留在本機。";
        return false;
      } finally {
        firestoreSaveInFlight = false;
        if (firestoreQueuedReason) {
          const queuedReason = firestoreQueuedReason;
          firestoreQueuedReason = "";
          queueFirestoreSave(queuedReason);
        }
      }
    }

    function queueFirestoreSave(reason) {
      clearTimeout(firestoreSaveTimer);
      firestoreSaveTimer = setTimeout(() => {
        saveFirestoreDraft(reason);
      }, FIRESTORE_SYNC_DEBOUNCE_MS);
    }

    async function loadFirestoreDraft() {
      const ref = firestoreProgressRef();
      if (!ref) {
        saveState.textContent = "尚未登入，這次先使用本機暫存。";
        return null;
      }
      try {
        const snap = await withTimeout(
          ref.get(),
          FIRESTORE_LOAD_TIMEOUT_MS,
          "Firestore load timeout"
        );
        const draft = snap.exists ? snap.data()?.mvpDraft : null;
        if (!draft || !Array.isArray(draft.questions)) return null;
        if (draft.version !== STORAGE_VERSION) {
          saveState.textContent = "已清除舊版進度，這次從空白測試開始。";
          queueFirestoreSave("重置舊版進度");
          return null;
        }

        const firestoreUpdatedAt = Date.parse(draft.savedAt || draft.exportedAt || "");
        const localUpdatedAt = Date.parse(readLocalDraftUpdatedAt() || "");
        if (hasLocalDraftData() && localUpdatedAt && firestoreUpdatedAt && localUpdatedAt > firestoreUpdatedAt) {
          saveState.textContent = "已保留較新的本機暫存，稍後同步 Firestore。";
          queueFirestoreSave("同步較新的本機暫存");
          return null;
        }

        restoreFirestoreDraft(draft);
        saveState.textContent = "已從 Firestore 載入上次進度。";
        return {
          activeIndex: Number.isFinite(Number(draft.activeIndex)) ? Number(draft.activeIndex) : 0
        };
      } catch (error) {
        console.warn("[S3W01] Firestore load failed", error);
        saveState.textContent = "Firestore 載入失敗，這次先使用本機暫存。";
        return null;
      }
    }

    function storageKey(id) {
      return localStoragePrefix() + id;
    }

    function fileStorageKey(id) {
      return storageKey(id) + ":files";
    }

    function reviewStorageKey(id) {
      return storageKey(id) + ":review";
    }

    function savedValue(id) {
      return localStorage.getItem(storageKey(id)) || "";
    }

    function savedAttachmentMeta(id) {
      try {
        const raw = localStorage.getItem(fileStorageKey(id));
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }

      if (!attachmentState.has(key)) {
        attachmentState.set(key, savedAttachmentMeta(id));

      const files = loadAttachments(id).map((file) => ({

        type: file.type,

        kind: file.kind,

    function classifyFile(file) {
      const type = (file.type || "").toLowerCase();
      const name = (file.name || "").toLowerCase();
      if (type.startsWith("image/") || /\.(png|jpe?g|webp)$/.test(name)) return "image";
      if (type.startsWith("video/") || /\.(mp4|webm|mov)$/.test(name)) return "video";
      if (type.startsWith("audio/") || /\.(mp3|wav|m4a)$/.test(name)) return "audio";
      return "file";
    }

    function typeChip(file) {
      const type = (file.type || "").toLowerCase();
      const name = (file.name || "").toLowerCase();
      if (type.includes("png") || name.endsWith(".png")) return "PNG";
      if (type.includes("jpeg") || type.includes("jpg") || /\.(jpe?g)$/.test(name)) return "JPG";
      if (type.includes("webp") || name.endsWith(".webp")) return "WEBP";
      if (type.includes("mp4") || name.endsWith(".mp4")) return "MP4";
      if (type.includes("mpeg") || name.endsWith(".mp3")) return "MP3";
      if (type.includes("wav") || name.endsWith(".wav")) return "WAV";
      if (type.includes("pdf") || name.endsWith(".pdf")) return "PDF";
      if (name.endsWith(".sb3")) return "SB3";
      if (name.endsWith(".zip")) return "ZIP";
      return file.kind === "image" ? "IMG" : file.kind === "video" ? "VID" : file.kind === "audio" ? "AUD" : "FILE";
    }

    function formatBytes(bytes) {
      if (!bytes) return "0 B";
      const units = ["B", "KB", "MB", "GB"];
      let value = bytes;
      let unit = 0;
      while (value >= 1024 && unit < units.length - 1) {
        value /= 1024;
        unit += 1;
      }
      return value.toFixed(value >= 10 || unit === 0 ? 0 : 1) + " " + units[unit];
    }

      if (q.expectedKind === "audio") return "audio";
      if (q.expectedKind === "image") return "image";

    function attachmentKindExists(q, kind) {
      return loadAttachments(q.id).some((file) => file.kind === kind);
    }

    function textMentionsResult(text, words) {
      const value = text.toLowerCase();
      return words.some((word) => value.includes(word.toLowerCase()));
    }

    function countMentions(text, words) {
      const value = text.toLowerCase();
      return words.reduce((sum, word) => sum + (value.includes(word.toLowerCase()) ? 1 : 0), 0);
    }

    function textHasThreePoints(text) {
      const lines = text.split(/\n+/).map((line) => line.trim()).filter(Boolean);
      if (lines.length >= 3) return true;
      return /1[\.、]/.test(text) && /2[\.、]/.test(text) && /3[\.、]/.test(text);
    }

    async function reviewCurrentAnswer() {
      const q = questions[activeIndex];
      const reviewedIndex = activeIndex;
      const wasDone = isDone(q.id);
      if (checkBtn.disabled && !wasDone) return;
      checkBtn.disabled = true;
      checkBtn.textContent = "AI 審核中...";
      aiBox.textContent = "AI 正在審核這一題，請稍等。";
      await new Promise((resolve) => setTimeout(resolve, 420));
      persistCurrentQuestion("送出審核前的答案");
      const text = answerInput.value.trim();
      const missing = [];

      if (q.expectedKind === "text") {
        if (!textHasThreePoints(text)) missing.push("第 1 題需要 3 點文字提醒。");
        if (!textMentionsResult(text, ["AI", "任務", "提示詞", "檢查", "生成"])) missing.push("提醒內容要跟 AI 工具使用有關。");
      }

      if (q.expectedKind === "image") {
        const imageKeywords = countMentions(text, ["小狗", "狗", "球", "玩", "草地", "可愛"]);
        const ok = attachmentKindExists(q, "image") || (textMentionsResult(text, ["圖片", "image"]) && imageKeywords >= 2);
        if (!ok) missing.push("第 2 題需要圖片附件，或明確描述小狗玩球圖片。");
      }

      if (q.expectedKind === "audio") {
        const audioKeywords = countMentions(text, ["咖啡廳", "爵士", "放鬆", "溫暖", "30 秒", "無人聲", "音樂", "音訊", "mp3", "wav"]);
        const ok = attachmentKindExists(q, "audio") || audioKeywords >= 2;
        if (!ok) missing.push("第 3 題需要音訊附件，或明確描述咖啡廳爵士樂。");
      }

      if (q.expectedKind === "video") {
        const videoKeywords = countMentions(text, ["滑雪", "雪地", "滑雪者", "往下滑", "5 秒", "影片", "mp4", "山坡"]);
        const ok = attachmentKindExists(q, "video") || videoKeywords >= 2;
        if (!ok) missing.push("第 4 題需要影片附件，或明確描述滑雪短影片。");
      }

      if (!text && loadAttachments(q.id).length === 0) {
        missing.push("答案與附件不能同時空白。");
      }

      const passed = missing.length === 0;
      const review = {
        passed,
        score: passed ? 3 : Math.max(0, 3 - missing.length),
        feedback: passed ? q.check + " AI 審核示範：通過。" : q.check + " AI 審核示範：需要修改。",
        missing,
        suggestions: passed ? ["可以送出給老師查看。"] : ["先補齊缺少的產出類型，再重新審核。"],
        reviewedAt: new Date().toISOString()
      };
      saveReview(q.id, review);
      aiBox.textContent = passed
        ? review.feedback + " " + review.suggestions[0]
        : review.feedback + " 缺少：" + missing.join(" ");
      saveState.textContent = passed ? q.code + " AI 審核通過，已自動儲存。" : q.code + " AI 審核未通過，已自動儲存目前答案。";
      renderTabs();
      updateDoneCount();
      updateReviewActionState(q);
      activeTitle.textContent = questionLabel(q);
      questionCode.textContent = questionLabel(q);
      emitIntegrationEvent("review", {
        questionId: q.id,
        code: q.code,
        passed,
        review
      });
      if (passed) {
        if (!wasDone) showQuestionCelebration(34);
        scheduleNextQuestionAfterPass(reviewedIndex);
      }
    }

    function applyApiResult(q, data) {

          objectUrl: data.imageUrl,

        });

          kind: "audio",
          size: data.audioUrl.length,
          objectUrl: data.audioUrl,
          downloadUrl: data.downloadUrl || data.audioUrl
        });
        persistCurrentQuestion("回填生成音樂");

      if (data.videoUrl) {

          objectUrl: data.videoUrl,
          downloadUrl: data.videoUrl
        });
        persistCurrentQuestion("回填生成影片");
        return true;
      }
      return false;
    }

    async function runToolOrDemo() {
      const q = questions[activeIndex];
      const tool = toolModes.find((item) => item.id === q.toolId);
      if (!tool) return;

      aiBox.textContent = "正在使用 " + tool.label + "。如果生成暫時不能用，會先放入示範成果。";

      if (!DEMO_ONLY && window.location.protocol !== "file:") {
        try {
          const payload = {
            task: q.title,
            prompt: q.toolPrompt,
            worksheetId: WORKSHEET_ID,
            duration: q.expectedKind === "video" ? 5 : undefined,
            durationMs: q.expectedKind === "audio" ? 30000 : undefined
          };
          const response = await fetch(tool.endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          const data = await response.json();
          if (response.ok && applyApiResult(q, data)) {
            aiBox.textContent = "已從 " + tool.label + " 回填成果。";
            renderTabs();
            updateDoneCount();
            updateWordState();
            emitIntegrationEvent("apiResult", {
              questionId: q.id,
              endpoint: tool.endpoint,
              data
            });
            return;
          }
        } catch {
          // Fall through to demo result.
        }
      }

      applyDemoResult(q, "目前使用示範成果完成 MVP 測試。");
    }

    function isDone(id) {
      return !!loadReview(id)?.passed;

      checkBtn.classList.toggle("is-complete", done);

    function scheduleNextQuestionAfterPass(fromIndex) {
      clearTimeout(autoAdvanceTimer);
      if (fromIndex >= questions.length - 1) return;
      if (questions.every((q) => isDone(q.id))) return;
      const nextIndex = fromIndex + 1;
      const nextQuestion = questions[nextIndex];
      saveState.textContent = questions[fromIndex].code + " 任務完成，準備前往 " + nextQuestion.code + "。";
      autoAdvanceTimer = setTimeout(() => {
        if (activeIndex === fromIndex && isDone(questions[fromIndex].id)) {
          switchQuestion(nextIndex);
        }
      }, 1200);
    }

    function hasDraft(id) {
      return savedValue(id).trim().length >= 12 || savedAttachmentMeta(id).length > 0;
    }

    function exportState() {
      return {
        courseId: "S3-W01",
        version: STORAGE_VERSION,
        activeIndex,
        activeQuestionId: questions[activeIndex]?.id || "",
        questions: questions.map((q) => ({
          id: q.id,
          code: q.code,
          title: q.title,
          toolId: q.toolId,
          expectedKind: q.expectedKind,
          text: savedValue(q.id),
          attachments: savedAttachmentMeta(q.id),
          review: loadReview(q.id),
          done: isDone(q.id),
          hasDraft: hasDraft(q.id)
        })),
        completedCount: questions.filter((q) => isDone(q.id)).length,
        exportedAt: new Date().toISOString()
      };
    }

    function renderAttachments() {
      const q = questions[activeIndex];
      const files = loadAttachments(q.id);
      attachmentCount.textContent = files.length + " 個檔案";
      attachmentList.innerHTML = "";

      if (files.length === 0) {
        const empty = document.createElement("div");
        empty.className = "attachment-empty";
        empty.textContent = uploadInstruction(q);
        attachmentList.appendChild(empty);
        return;
      }

      files.forEach((file) => {
        const item = document.createElement("div");
        item.className = "attachment-item";

        const chip = document.createElement("div");
        chip.className = "type-chip";
        chip.textContent = typeChip(file);

        const main = document.createElement("div");
        main.className = "attachment-main";

        const name = document.createElement("div");
        name.className = "attachment-name";
        name.textContent = file.name;

        const meta = document.createElement("div");
        meta.className = "attachment-meta";
        meta.textContent = formatBytes(file.size) + " · " + (file.source === "lab-tool" ? "Lab 工具回填" : "學生上傳");

        main.appendChild(name);
        main.appendChild(meta);

        if (file.objectUrl && file.kind === "image") {
          const img = document.createElement("img");
          img.className = "attachment-preview";
          img.src = file.objectUrl;
          img.alt = file.name;
          main.appendChild(img);
        }

        if (file.objectUrl && file.kind === "video") {
          const video = document.createElement("video");
          video.className = "attachment-preview";
          video.src = file.objectUrl;
          video.controls = true;
          main.appendChild(video);
        }

        if (file.objectUrl && file.kind === "audio") {
          const audio = document.createElement("audio");
          audio.className = "attachment-preview audio";
          audio.src = file.objectUrl;
          audio.controls = true;
          main.appendChild(audio);
        }

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "attachment-remove";
        remove.textContent = "X";
        remove.setAttribute("aria-label", "移除 " + file.name);
        remove.addEventListener("click", () => removeAttachment(file.id));

        item.appendChild(chip);
        item.appendChild(main);
        item.appendChild(remove);
        attachmentList.appendChild(item);
      });
    }

    function addFiles(fileList) {
      const q = questions[activeIndex];
      if (!q || q.expectedKind === "text") {
        aiBox.textContent = "這一題只需要填文字，不需要上傳檔案。";
        return;
      }
      const current = loadAttachments(q.id);
      const expectedKind = expectedFileKind(q);
      const allIncoming = Array.from(fileList || []).map((file) => {
        const kind = classifyFile(file);
        const canPreview = kind === "image" || kind === "video" || kind === "audio";
        return {
          id: "file_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8),
          name: file.name,
          type: file.type || "application/octet-stream",
          size: file.size,
          kind,
          objectUrl: canPreview ? URL.createObjectURL(file) : "",
          storagePath: "demo://pending-upload/" + q.id + "/" + file.name,
          downloadUrl: "",
          source: "upload",
          toolId: "",
          pendingUpload: true
        };
      });
      const incoming = allIncoming.filter((file) => file.kind === expectedKind);

      if (incoming.length === 0) {
        aiBox.textContent = "檔案類型不符合這一題，請依照題目加入正確的作品檔案。";
        return;
      }

      attachmentState.set(attachmentStateKey(q.id), current.concat(incoming));
      renderAttachments();
      renderTabs();
      updateDoneCount();
      updateWordState();
      persistCurrentQuestion("加入 " + incoming.length + " 個檔案");
      flashUploadSuccess("已成功加入 " + incoming.length + " 個作品檔案，可以按「送 AI 審核」。");
      aiBox.textContent = "檔案已成功加入：" + incoming.map((file) => file.name).join("、");
      emitIntegrationEvent("attachment:upload", {
        questionId: q.id,
        files: incoming
      });
    }

    function removeAttachment(fileId) {
      const q = questions[activeIndex];
      const next = loadAttachments(q.id).filter((file) => {
        if (file.id === fileId && file.objectUrl) URL.revokeObjectURL(file.objectUrl);
        return file.id !== fileId;
      });
      attachmentState.set(attachmentStateKey(q.id), next);
      renderAttachments();
      renderTabs();
      updateDoneCount();
      updateWordState();
      persistCurrentQuestion("移除檔案");
      emitIntegrationEvent("attachment:remove", {
        questionId: q.id,
        fileId
      });
    }

    function updateDoneCount() {
      const done = questions.filter((q) => isDone(q.id)).length;
      doneCount.textContent = done + "/" + questions.length + " 已通過";
      meterFill.style.width = String((done / questions.length) * 100) + "%";
      if (done === questions.length) {
        revokeLabMediaAccess();
        maybeShowCompletion();
      } else {
        grantLabMediaAccess();
      }
    }

    function maybeShowCompletion() {
      if (completionShown || !questions.every((q) => isDone(q.id))) return;
      completionShown = true;
      try {
        sessionStorage.setItem(completionStorageKey(), "yes");
      } catch {
        // Session storage can be unavailable in restricted browser modes.
      }
      showCompletionCelebration();
      emitIntegrationEvent("complete", {
        state: exportState()
      });
      queueFirestoreSave("全部完成");
    }

    function showQuestionCelebration(count) {
      questionConfetti.innerHTML = "";
      const colors = ["#65f4d8", "#4dc9ff", "#ff4dd8", "#ffd35c", "#a78bfa", "#38ff8c"];
      for (let index = 0; index < count; index += 1) {
        const piece = document.createElement("span");
        piece.className = "confetti-piece";
        piece.style.left = Math.random() * 100 + "%";
        piece.style.setProperty("--piece-color", colors[index % colors.length]);
        piece.style.setProperty("--fall-time", 1.1 + Math.random() * 0.9 + "s");
        piece.style.setProperty("--fall-drift", (Math.random() * 160 - 80) + "px");
        piece.style.setProperty("--fall-rotate", (Math.random() * 540 - 270) + "deg");
        piece.style.animationDelay = Math.random() * 0.24 + "s";
        questionConfetti.appendChild(piece);
      }
      setTimeout(() => {
        questionConfetti.innerHTML = "";
      }, 2400);
    }

    function showCompletionCelebration() {
      completionOverlay.hidden = false;
      cyberConfetti.innerHTML = "";
      const colors = ["#65f4d8", "#4dc9ff", "#ff4dd8", "#ffd35c", "#a78bfa", "#38ff8c"];
      for (let index = 0; index < 92; index += 1) {
        const piece = document.createElement("span");
        piece.className = "confetti-piece";
        piece.style.left = Math.random() * 100 + "%";
        piece.style.setProperty("--piece-color", colors[index % colors.length]);
        piece.style.setProperty("--fall-time", 1.4 + Math.random() * 1.1 + "s");
        piece.style.setProperty("--fall-drift", (Math.random() * 220 - 110) + "px");
        piece.style.setProperty("--fall-rotate", (Math.random() * 720 - 360) + "deg");
        piece.style.animationDelay = Math.random() * 0.45 + "s";
        cyberConfetti.appendChild(piece);
      }
      setTimeout(() => {
        cyberConfetti.innerHTML = "";
      }, 3200);
    }

    function renderToolModes() {
      toolSwitcher.innerHTML = "";
      toolModes.forEach((tool) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "tool-mode-btn" + (activeTool === tool.id ? " active" : "");
        button.textContent = tool.label;
        button.setAttribute("aria-label", "切換到 Lab " + tool.label);
        button.title = "回主頁並切換到 Lab " + tool.label;
        button.addEventListener("click", () => {
          const homeMode = tool.id === "terminal" ? "text" : tool.id;
          if (tool.id !== "terminal" && !questions.every((item) => isDone(item.id))) {
            grantLabMediaAccess();
          }
          emitIntegrationEvent("toolHome", {
            selectedToolId: tool.id,
            homeMode
          });
          window.location.href = "/?labTool=" + encodeURIComponent(homeMode);
          return;
          activeTool = tool.id;
          renderToolModes();
          const q = questions[activeIndex];
          aiBox.textContent = tool.note + (tool.id === q.toolId ? " 這是本題建議工具。" : " 注意：這不是本題建議工具。");
          emitIntegrationEvent("toolChange", {
            questionId: q.id,
            selectedToolId: tool.id,
            recommendedToolId: q.toolId,
            matched: tool.id === q.toolId
          });
        });
        toolSwitcher.appendChild(button);
      });
    }

    function renderTabs() {
      tabs.innerHTML = "";
      questions.forEach((q, index) => {
        const done = isDone(q.id);
        const button = document.createElement("button");
        button.type = "button";
        button.className = "tab-btn" + (index === activeIndex ? " active" : "") + (done ? " done" : "");
        button.textContent = String(index + 1);
        button.setAttribute("aria-label", q.code + (done ? " 已完成" : ""));
        button.addEventListener("click", () => switchQuestion(index));
        tabs.appendChild(button);
      });
    }

    function updateWordState() {
      const q = questions[activeIndex];
      if (q && q.expectedKind !== "text") {
        const files = loadAttachments(q.id);
        wordState.textContent = "目前已加入 " + files.length + " 個作品檔案。系統會自動保存。";
        return;
      }
      const text = answerInput.value.trim();
      wordState.textContent = "目前 " + text.length + " 字。系統會自動保存。";
    }

    function updateSaveStateForQuestion(q) {
      const review = loadReview(q.id);
      if (review?.passed) {
        saveState.textContent = q.code + " AI 審核通過，已自動儲存。";
        updateReviewActionState(q);
        return;
      }
      const text = answerInput.value.trim();
      const files = loadAttachments(q.id);
      if (text || files.length) {
        saveState.textContent = q.code + " 已有自動儲存的內容。";
      } else {
        saveState.textContent = q.code + " 尚未回填";
      }
      updateReviewActionState(q);
    }

    function switchQuestion(index) {
      clearTimeout(autoAdvanceTimer);
      if (hasRenderedQuestion) persistCurrentQuestion("切換任務前保存");
      activeIndex = Math.max(0, Math.min(index, questions.length - 1));
      const q = questions[activeIndex];
      activeTool = q.toolId;
      activeTitle.textContent = questionLabel(q);
      questionCode.textContent = questionLabel(q);
      questionCoins.textContent = q.coins + " 金幣";
      questionTitle.textContent = q.title;
      questionPrompt.textContent = q.prompt;
      gammaHint.textContent = "請看左側 GAMMA 題目。";
      answerInput.placeholder = q.placeholder;
      answerInput.value = savedValue(q.id);
      const needsTextAnswer = q.expectedKind === "text";
      answerInput.hidden = !needsTextAnswer;
      answerInput.disabled = !needsTextAnswer;
      attachmentPanel.hidden = needsTextAnswer;
      fileInput.accept = acceptForQuestion(q);
      uploadNote.textContent = needsTextAnswer ? "" : uploadInstruction(q);
      renderAttachments();
      const tool = toolModes.find((item) => item.id === q.toolId);
      aiBox.textContent = "本題建議工具：" + (tool ? "Lab " + tool.label : "Lab Terminal") + "。AI 回饋會顯示在這裡。";
      renderToolModes();
      renderTabs();
      updateDoneCount();
      updateWordState();
      updateSaveStateForQuestion(q);
      emitIntegrationEvent("questionChange", {
        questionId: q.id,
        index: activeIndex,
        toolId: q.toolId
      });
      queueFirestoreSave("切換任務");
      hasRenderedQuestion = true;
    }

    window.S3W01_MVP = {
      version: STORAGE_VERSION,
      questions,
      toolModes,
      exportState,
      switchQuestion,
      reviewCurrentAnswer,
      runToolOrDemo
    };

    answerInput.addEventListener("input", () => {
      renderTabs();
      updateDoneCount();
      updateWordState();
      scheduleAutoSave("輸入文字");
    });

    attachBtn.addEventListener("click", () => {
      fileInput.click();
    });

    fileInput.addEventListener("change", () => {
      addFiles(fileInput.files);
      fileInput.value = "";
    });

    attachmentPanel.addEventListener("dragover", (event) => {
      event.preventDefault();
      attachmentPanel.classList.add("drag-over");
    });

    attachmentPanel.addEventListener("dragleave", () => {
      attachmentPanel.classList.remove("drag-over");
    });

    attachmentPanel.addEventListener("drop", (event) => {
      event.preventDefault();
      attachmentPanel.classList.remove("drag-over");
      addFiles(event.dataTransfer.files);
    });

    checkBtn.addEventListener("click", () => {
      reviewCurrentAnswer();
    });

    completionCloseBtn.addEventListener("click", () => {
      completionOverlay.hidden = true;
    });

    async function bootS3W01Mvp() {
      purgeLegacyLocalProgressOnce();
      renderToolModes();
      const draft = await loadFirestoreDraft();
      switchQuestion(draft?.activeIndex || 0);
      document.documentElement.dataset.s3w01Mvp = "ready";
      emitIntegrationEvent("ready", {
        state: exportState()
      });
    }

    bootS3W01Mvp();
  </script>
</body>
</html>
