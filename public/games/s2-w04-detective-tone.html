<style>

  @media(max-width:560px){.tones{grid-template-columns:repeat(2,1fr);}}
  .tone{background:linear-gradient(180deg,#16304f,#102540);border:2px solid var(--line);border-radius:16px;padding:12px 8px;cursor:pointer;

  .tone:active{transform:translateY(1px);}

<script>
/* =========================================================================
   S2-W04《阿問偵探社・第四話：語氣變身術 — 被搞砸的園遊會》
   學習核心＝語氣控制：對不同的人用對的語氣，他才願意開口。
   兩幕：第一幕用 4 種語氣問 4 個人找出「是誰」→ 翻轉（他是好意）→
         第二幕用同 4 種語氣換情境再問 4 個人，找出「為什麼」並和解。
   引擎（DOM 單檔 / 存檔綁 uid / 金幣冪等 / 防硬按泡泡題）沿用 S2-W03 chassis。
   每一段之後都接互動確認，沒有純「繼續」的頁面。
   ========================================================================= */
const stage=document.getElementById('stage');
const $=(s,r)=>(r||document).querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const now=()=>performance.now();
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
/* 語氣改寫一律要自己打字。
   照著回饋裡的範例句重打一遍沒關係——那也是練習；但複製貼上就完全沒練到。
   paste 事件涵蓋 Ctrl+V、右鍵貼上、長按貼上；拖曳文字進來是另一條路，所以 drop 也要擋。
   要在 ta 進 DOM 之後才呼叫（提示訊息是插在它後面）。 */
function noPaste(ta){
  const warn=el('div','err','這句要自己打喔，不能貼上。');
  warn.style.display='none';
  ta.insertAdjacentElement('afterend',warn);
  let t=null;
  const block=(e)=>{
    e.preventDefault();
    warn.style.display='';
    clearTimeout(t); t=setTimeout(()=>{warn.style.display='none';},2400);
  };
  ta.addEventListener('paste',block);
  ta.addEventListener('drop',block);
  return ta;
}
// 圖片載不到就退成色塊，離線也不會開天窗（沿用 S2-W03）
function pic(name,cls){const w=el('div','img'+(cls?' '+cls:''));const im=document.createElement('img');
  im.src='assets/'+name+(/\.(png|jpe?g|webp)$/i.test(name)?'':'.png');im.alt='';im.onerror=()=>w.classList.add('fail');
  w.appendChild(im);return w;}

/* ---------- 音效（程序化，不用音檔） ---------- */
const Sfx=(()=>{let ac=null;function ctx(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();}catch(e){}return ac;}
  function tone(f,d,t,v){const a=ctx();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=t||'sine';o.frequency.value=f;
    g.gain.setValueAtTime(0,a.currentTime);g.gain.linearRampToValueAtTime(v||.06,a.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+(d||.15));o.connect(g);g.connect(a.destination);
    o.start();o.stop(a.currentTime+(d||.15));}
  return {tick(){tone(430,.05,'triangle',.05);},ding(){tone(880,.12,'sine',.06);setTimeout(()=>tone(1320,.14,'sine',.05),70);},
    pop(){tone(260,.12,'square',.05);},bad(){tone(180,.2,'sawtooth',.05);},
    win(){[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,.17,'square',.05),i*95));},resume(){ctx();}};
})();

/* ---------- 帳號綁定（gameKey s2w04 獨立存檔；coins/{uid} 錢包與全系列共用） ---------- */
const GAMEKEY='s2w04';
/* 金幣：規格 §1 的課綱是 35。拆法要剛好加到 35，否則學習單列表會顯示對不起來的數字。
   給幣的章節＝前情提要 2 ＋ 語氣教學 4 ＋ 訪談 8 ＋ 翻轉 1 ＝ 15 章 ×2 ＝ 30
   ＋ 兩幕推理各 2 ＝ 4 ＋ 破案 1 ＝ 35。小老師另計 17（約任務的 50%，CLAUDE.md §21）。 */
const COIN_PER_CH=2, COIN_ACT=2, COIN_DONE=1, COIN_TA=17;
const TOTAL_COINS=35+COIN_TA;   // 52
const FB={apiKey:"AIzaSyDVnab3BCfnlJH5cRCz_EqaHlP7yQUpK78",authDomain:"gpt-clone-68b9f.firebaseapp.com",projectId:"gpt-clone-68b9f",storageBucket:"gpt-clone-68b9f.firebasestorage.app",messagingSenderId:"436942056069",appId:"1:436942056069:web:8762675dfff7b7e92017ec"};
const Account=(()=>{let uid=null,uname='',db=null,ready=false;
  function su(){try{const r=(sessionStorage.getItem('@session/currentUser')||localStorage.getItem('@session/currentUser'));return r?JSON.parse(r):null;}catch(e){return null;}}
  function init(){const u=su();if(u&&u.id){uid=u.id;uname=u.displayName||u.username||'';}
    if(uid&&window.firebase){try{if(!firebase.apps.length)firebase.initializeApp(FB);db=firebase.firestore();ready=true;}catch(e){}}}
  async function load(){if(!ready)return null;try{const s=await db.collection('gameProgress').doc(uid).get();return s.exists?(s.data()[GAMEKEY]||null):null;}catch(e){return null;}}
  async function save(state){if(!ready)return;try{await db.collection('gameProgress').doc(uid).set({[GAMEKEY]:state,name:uname,updatedAt:new Date().toISOString()},{merge:true});}catch(e){}}
  async function creditCoins(id,amount,reason){if(!ready||!(amount>0))return;const ref=db.collection('coins').doc(uid);
    try{await db.runTransaction(async tx=>{const s=await tx.get(ref);const c=s.exists?s.data():{balance:0,totalEarned:0,transactions:[]};
      const txs=Array.isArray(c.transactions)?c.transactions:[];
      if(txs.some(t=>t&&t.id===id))return;                       // 冪等：同一個 id 只入帳一次
      txs.push({id,amount,reason,timestamp:new Date().toISOString()});
      tx.set(ref,{balance:(c.balance||0)+amount,totalEarned:(c.totalEarned||0)+amount,transactions:txs.slice(-160)});});}catch(e){}}
  return {init,load,save,creditCoins,get ready(){return ready;},get uid(){return uid;},get name(){return uname;}};
})();
Account.init();

/* ---------- 存檔（鍵綁 uid：共用電腦不會繼承上一位學生的進度） ---------- */
const VERSION=1;
function defaultState(){ return { v:VERSION, ch:0, chMax:0, coins:0, done:false, pct:0,
  clues:{}, ta:false }; }
let S=defaultState();
const SKEY=(()=>{ const base='game:'+GAMEKEY;
  try{ localStorage.removeItem(base); }catch(e){}          // 清掉舊版沒綁人的存檔
  try{ const r=sessionStorage.getItem('@session/currentUser')||localStorage.getItem('@session/currentUser');
       const u=r?JSON.parse(r):null; return base+':'+((u&&u.id)||'anon'); }catch(e){ return base+':anon'; } })();
function overallPct(){ return S.done?1:clamp(S.chMax/CHAPTERS.length,0,1); }
function persist(){ S.pct=overallPct(); try{ localStorage.setItem(SKEY,JSON.stringify(S)); }catch(e){} Account.save(S); }
function loadLocal(){ try{ const r=localStorage.getItem(SKEY); if(r){ const o=JSON.parse(r); if(o&&o.v===VERSION) return o; } }catch(e){} return null; }
/* 雲端／本機哪一份比較遠：先比是否破案，再比進度，可增不可減的欄位取聯集 */
function progressScore(s){ return s? (s.done?1e6:0)+(s.chMax||0)*10+Object.keys(s.clues||{}).length : -1; }
function mergeProgress(dst,other){ if(!dst||!other) return dst;
  dst.chMax=Math.max(dst.chMax||0,other.chMax||0);
  dst.coins=Math.max(dst.coins||0,other.coins||0);
  dst.done=!!(dst.done||other.done); dst.ta=!!(dst.ta||other.ta);
  dst.clues=Object.assign({},other.clues||{},dst.clues||{});
  return dst; }
function addCoins(id,amount,reason){
  S.coins=Math.min(TOTAL_COINS,(S.coins||0)+amount);
  Account.creditCoins(GAMEKEY+'_'+id,amount,reason);
  renderCoin(); persist(); }
function renderCoin(){ const h=$('#coinHud'); if(h) h.textContent='🪙 '+(S.coins||0)+' / '+TOTAL_COINS; }

/* =========================================================================
   四種語氣（語氣變身器）
   ok＝這個語氣的關鍵字，玩家自己打的句子要含其中一個才算「寫出那個語氣」。
   bad＝明顯不符該語氣的字，出現就給具體錯誤訊息。
   ========================================================================= */
const TONES={
  warm:    { name:'溫柔', zh:'ㄨㄣ ㄋㄩㄡˊ', col:'var(--t-warm)',    use:'對方害怕、難過',
             ok:['沒關係','別怕','不要怕','慢慢','好嗎','可以嗎','我陪你','不會罵'],
             bad:['快說','講啊','笨','煩'], tpl:'＿＿＿，可以慢慢告訴我＿＿＿嗎？',
             eg:'別怕，沒關係，可以慢慢告訴我你看到什麼嗎？' },
  serious: { name:'認真', zh:'ㄖㄣˋ ㄓㄣ', col:'var(--t-serious)', use:'對方嘴硬、亂講',
             ok:['很重要','認真','真的','事實','請你','幫忙想','仔細'],
             bad:['隨便','無聊','算了','開玩笑'], tpl:'這件事很重要，請你＿＿＿。',
             eg:'這件事很重要，請你認真想一想昨天晚上的事。' },
  funny:   { name:'搞笑', zh:'ㄍㄠˇ ㄒㄧㄠˋ', col:'var(--t-funny)',  use:'對方在鬧脾氣、緊張',
             ok:['哈','嘿','好啦','別氣','笑','有趣','好玩','放輕鬆'],
             bad:['閉嘴','不准','嚴重','警告'], tpl:'哈哈，＿＿＿，先別氣好嗎？',
             eg:'哈哈別氣啦，你氣起來好像一顆生氣的番茄，先跟我說發生什麼事？' },
  polite:  { name:'有禮貌', zh:'ㄧㄡˇ ㄌㄧˇ ㄇㄠˋ', col:'var(--t-polite)', use:'對方是長輩、很忙',
             ok:['請問','謝謝','不好意思','打擾','麻煩','您'],
             bad:['喂','快點','我要','馬上'], tpl:'不好意思打擾您，請問＿＿＿？',
             eg:'不好意思打擾您，請問昨天晚上有沒有下雨呢？謝謝您。' },
};
const TONE_KEYS=['warm','serious','funny','polite'];
/* 自繪語氣圖示（規格要求非 emoji） */
function toneIcon(k,size){
  const s=size||44, ns='http://www.w3.org/2000/svg';
  const sv=document.createElementNS(ns,'svg'); sv.setAttribute('viewBox','0 0 48 48');
  sv.setAttribute('width',s); sv.setAttribute('height',s);
  const col=getComputedStyle(document.documentElement).getPropertyValue('--t-'+
    (k==='warm'?'warm':k==='serious'?'serious':k==='funny'?'funny':'polite')).trim()||'#fff';
  const c=document.createElementNS(ns,'circle'); c.setAttribute('cx',24); c.setAttribute('cy',24);
  c.setAttribute('r',20); c.setAttribute('fill','none'); c.setAttribute('stroke',col); c.setAttribute('stroke-width',3);
  sv.appendChild(c);
  const mk=(d,w)=>{const p=document.createElementNS(ns,'path');p.setAttribute('d',d);p.setAttribute('fill','none');
    p.setAttribute('stroke',col);p.setAttribute('stroke-width',w||3);p.setAttribute('stroke-linecap','round');sv.appendChild(p);};
  const eye=(x,y,r)=>{const e=document.createElementNS(ns,'circle');e.setAttribute('cx',x);e.setAttribute('cy',y);
    e.setAttribute('r',r||2.4);e.setAttribute('fill',col);sv.appendChild(e);};
  if(k==='warm'){    eye(17,21); eye(31,21); mk('M16 30 Q24 35 32 30'); }           // 微笑
  if(k==='serious'){ mk('M14 20 L21 20',3); mk('M27 20 L34 20',3); mk('M17 31 L31 31'); } // 平嘴
  if(k==='funny'){   mk('M14 19 Q17 15 20 19'); mk('M28 19 Q31 15 34 19'); mk('M15 28 Q24 38 33 28'); } // 大笑
  // ⚠️ SVG 的 y 往下增加：控制點的 y 要比端點「大」才會往下彎成笑臉。
  //    第一版寫成 Q24 28（比端點的 33 小）＝往上彎＝苦臉，實際畫面上看起來像在難過。
  if(k==='polite'){  eye(17,20); eye(31,20); mk('M14 31 Q24 37 34 31'); mk('M24 8 L24 13'); } // 微笑＋點頭
  return sv;
}

/* =========================================================================
   語氣審核：交給 AI 判斷「整句話有沒有那個語氣」，而不是比對關鍵字。
   關鍵字做不到這件事——
     「我沒關係啦你快講」有「沒關係」卻在催人；
     「你先深呼吸，等你準備好再說」一個關鍵字都沒有卻很溫柔。
   ⚠️ AI 連不上或逾時 → 退回本地關鍵字判定。規格 §6 要求離線可用、載入逾時放行，
      不能因為後端掛了就把學生卡在那一關。
   ========================================================================= */
function localReview(toneKey,txt){
  const T=TONES[toneKey];
  if(txt.length<6) return {passed:false,feedback:'句子太短了，照上面的模板寫一句完整的話。'};
  const bad=T.bad.find(w=>txt.includes(w));
  if(bad) return {passed:false,feedback:'「'+bad+'」不太像「'+T.name+'」喔，換個說法。'};
  if(!T.ok.some(w=>txt.includes(w)))
    return {passed:false,feedback:'還不夠「'+T.name+'」。試著用上：'+T.ok.slice(0,3).join('、')};
  return {passed:true,feedback:'這句很「'+T.name+'」！'};
}
async function reviewTone(toneKey,txt,target,mood){
  const T=TONES[toneKey];
  // 太短或亂打先本地擋掉，不用浪費一次 API 來回
  if(txt.length<6) return {passed:false,feedback:'句子太短了，照上面的模板寫一句完整的話。',by:'local'};
  try{
    const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),10000); // 逾時 10s → 放行給本地
    const r=await fetch('/api/review-tone',{ method:'POST', signal:ctl.signal,
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ tone:T.name, toneUse:T.use, target:target||'', targetMood:mood||'', sentence:txt }) });
    clearTimeout(to);
    if(!r.ok) throw new Error('http '+r.status);
    const j=await r.json();
    if(typeof j.passed!=='boolean') throw new Error('bad shape');
    return { passed:j.passed, feedback:j.feedback||(j.passed?'很好！':'再想想語氣。'), by:'ai' };
  }catch(e){
    const lo=localReview(toneKey,txt); lo.by='local'; return lo;
  }
}
/* 過關後自動捲到下一題（同一頁時）——不要讓小孩以為卡住了。
   ⚠️ 有些情況下 behavior:'smooth' 會被忽略（分頁在背景、使用者設了減少動態效果、
      或瀏覽器節流），實測就遇過完全沒捲動。所以捲完再檢查一次，還在畫面外就用瞬間捲補上。 */
function scrollToNext(node){
  if(!node) return;
  const inView=()=>{ const r=node.getBoundingClientRect(); return r.top>=0 && r.top<innerHeight*0.9; };
  setTimeout(()=>{
    try{ node.scrollIntoView({behavior:'smooth',block:'center'}); }catch(e){}
    setTimeout(()=>{ if(!inView()){ try{ node.scrollIntoView({block:'center'}); }catch(e){ node.scrollIntoView(); } } },600);
  },120);
}

/* =========================================================================
   泡泡小考：三顆漂浮泡泡，點錯鎖 2＋N 秒並重洗位置（防硬按）。
   答對才會進下一段——沒有純「繼續」。
   ========================================================================= */
function bubbleQuiz(host,q,onPass){
  const box=el('div','card');
  box.appendChild(el('h2',null,'考考你'));
  box.appendChild(el('p','lead',q.q));
  const wrap=el('div','qbs'); box.appendChild(wrap);
  const msg=el('div','err'); box.appendChild(msg);
  host.appendChild(box);
  let wrongN=0, lockUntil=0;
  const opts=shuffle(q.opts.map((t,i)=>({t,ok:i===q.a})));
  function layout(){
    wrap.innerHTML='';
    shuffle(opts).forEach((o,i)=>{
      const b=el('button','qb',o.t);
      const cols=wrap.clientWidth||600, size=Math.min(150,Math.max(96,cols/3.4));
      b.style.width=b.style.height=size+'px';
      b.style.left=Math.round(i*(cols-size)/Math.max(1,opts.length-1))+'px';
      b.style.top=Math.round(18+Math.random()*(230-size-30))+'px';
      b.onclick=()=>{
        if(now()<lockUntil){ Sfx.pop(); return; }
        if(o.ok){ Sfx.ding(); msg.style.color='var(--good)'; msg.textContent='答對了！';
          wrap.querySelectorAll('.qb').forEach(x=>x.disabled=true);
          setTimeout(onPass,650); }
        else{ Sfx.bad(); wrongN++; lockUntil=now()+2000+(wrongN-1)*1000;
          msg.style.color='var(--warn)';
          msg.textContent='再想想～ 等一下下（'+Math.round((lockUntil-now())/1000)+' 秒）';
          wrap.classList.add('locked');
          const tk=setInterval(()=>{ const left=Math.ceil((lockUntil-now())/1000);
            if(left<=0){ clearInterval(tk); wrap.classList.remove('locked'); msg.textContent=''; layout(); }
            else msg.textContent='再想想～ 等一下下（'+left+' 秒）'; },250); }
      };
      wrap.appendChild(b);
    });
  }
  layout();
  return box;   // 回傳節點，讓呼叫端可以直接捲到這一題（不要用 children[index] 猜）
}

  let picked=null;
  TONE_KEYS.forEach(k=>{
    const T=TONES[k], b=el('button','tone'); b.style.setProperty('--c',T.col);
    b.appendChild(toneIcon(k));
    b.appendChild(el('div','nm',T.name));
    b.appendChild(el('div','use',T.use));
    b.onclick=()=>{ picked=k; Sfx.tick();
      [...tg.children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
      tpl.textContent='填空模板：'+T.tpl; eg.textContent='例如：'+T.eg; err.textContent='';
      ta.placeholder='用「'+T.name+'」的語氣打一句話…'; ta.focus(); };
    tg.appendChild(b);
  });
  tc.appendChild(tg);
  const tpl=el('div','tpl','先選一個語氣'); tc.appendChild(tpl);
  const ta=el('textarea'); ta.placeholder='先選一個語氣，再打一句話…'; tc.appendChild(ta); noPaste(ta);

    } else {
      Sfx.bad();
      err.textContent='他更不想說了。換一種語氣，或把句子改一下再試——不會被扣分。';
    }
  };
}

/* ---------- 章0：語氣教學。一關只教一種語氣、只打一句話 ---------- */
function renderTone0(ch,i){
  stage.innerHTML=''; stage.appendChild(header(ch,i));
  if(ch.scene) stage.appendChild(pic(ch.scene+'.jpg',''));
  const T=TONES[ch.tone];
  const c1=el('div','card');
  c1.appendChild(el('div','bubble',ch.intro));
  c1.appendChild(el('div','bubble ask',ch.intro2));
  stage.appendChild(c1);

  const c2=el('div','card');
  // 這一關只顯示這一種語氣（其餘三種要等各自的關卡），版面不會又是四選一
  const head=el('div','tones'); head.style.gridTemplateColumns='1fr';
  const chip=el('div','tone on'); chip.style.setProperty('--c',T.col);
  chip.appendChild(toneIcon(ch.tone,52));
  chip.appendChild(el('div','nm',T.name));
  chip.appendChild(el('div','use','什麼時候用：'+T.use));
  head.appendChild(chip); c2.appendChild(head);

  c2.appendChild(el('div','tpl','填空模板：'+T.tpl));
  const ta=el('textarea'); ta.placeholder='用「'+T.name+'」的語氣打一句話…'; c2.appendChild(ta); noPaste(ta);
  c2.appendChild(el('div','eg','例如：'+T.eg));
  const err=el('div','err'); c2.appendChild(err);
  const ok=el('button','btn wide','這句可以'); c2.appendChild(ok);
  stage.appendChild(c2);
  setTimeout(()=>ta.focus(),100);

  ok.onclick=async()=>{
    Sfx.resume();
    const txt=(ta.value||'').trim();
    ok.disabled=true; const label=ok.textContent; ok.textContent='阿問正在看…';
    err.style.color='var(--dim)'; err.textContent='';
    const v=await reviewTone(ch.tone, txt);
    ok.textContent=label;
    if(!v.passed){ ok.disabled=false; err.style.color='var(--warn)'; err.textContent=v.feedback; Sfx.pop(); return; }
    Sfx.ding(); err.style.color='var(--good)'; err.textContent=v.feedback;
    ta.disabled=true;
    addCoins('ch'+i, COIN_PER_CH, 'S2-W04 '+T.name+'練習');
    scrollToNext(bubbleQuiz(stage, ch.quiz, ()=>goCh(i+1)));   // 自動捲到剛長出來的那一題
  };
}

/* ---------- 翻轉／推理／結局 ---------- */
function renderTwist(ch,i){
  stage.innerHTML=''; stage.appendChild(header(ch,i));
  if(ch.scene) stage.appendChild(pic(ch.scene+'.jpg',''));
  const c=el('div','card');
  c.appendChild(el('div','bubble',ch.intro));
  c.appendChild(el('div','bubble ask',ch.intro2));
  stage.appendChild(c);
  bubbleQuiz(stage, ch.quiz, ()=>{ addCoins('ch'+i,COIN_PER_CH,'S2-W04 翻轉'); goCh(i+1); });
}
function renderDeduce(ch,i){
  stage.innerHTML=''; stage.appendChild(header(ch,i));
  const c=el('div','card');
  c.appendChild(el('h2',null,'先把線索攤開'));
  c.appendChild(el('p','lead','四條線索都在這裡，看看它們指向同一件事。'));
  stage.appendChild(c);
  clueBoard(stage, ch.need);
  bubbleQuiz(stage, ch.quiz, ()=>{ addCoins('act'+ch.act,COIN_ACT,'S2-W04 第'+ch.act+'幕破案'); goCh(i+1); });
}
function renderEnd(ch,i){
  stage.innerHTML=''; stage.appendChild(header(ch,i));
  if(ch.scene) stage.appendChild(pic(ch.scene+'.jpg',''));
  if(!S.done){ S.done=true; addCoins('done',COIN_DONE,'S2-W04 破案'); }
  const c=el('div','card');
  c.appendChild(el('h1',null,'最會好好說話的偵探'));
  c.appendChild(el('p','lead','招牌掛回去了，園遊會照常舉行。沒有壞人，只有一場好意造成的誤會。'));
  c.appendChild(el('div','bubble good','你學到的事：同一句話，換個語氣，對方肯不肯講差很多。'));
  stage.appendChild(c);
  clueBoard(stage, Object.keys(CLUE_TEXT));
  const c2=el('div','card');
  const ta=el('button','btn wide', S.ta?'已經當過小老師':'我是小偵探學長');
  ta.disabled=!!S.ta;
  ta.onclick=()=>{ S.ta=true; ta.disabled=true; ta.textContent='已經當過小老師';
    addCoins('ta',COIN_TA,'S2-W04 小老師');
    toast('去教一位同學：怎麼看對方的情緒選語氣！'); };
  c2.appendChild(ta);
  const home=el('button','btn ghost wide','回學習單'); home.style.marginTop='10px';
  home.onclick=()=>{ location.href='/worksheets'; };
  c2.appendChild(home);
  stage.appendChild(c2);
}
function toast(msg){ const t=el('div','toast',msg); document.body.appendChild(t);
  setTimeout(()=>t.remove(),2600); }

/* ---------- 流程控制 ---------- */
function goCh(i){
  if(i>=CHAPTERS.length) i=CHAPTERS.length-1;
  S.ch=i; if(i>S.chMax) S.chMax=i;
  persist(); renderCoin();
  window.scrollTo(0,0);
  const ch=CHAPTERS[i];
  if(ch.type==='tone0')  return renderTone0(ch,i);
  if(ch.type==='talk')   return renderTalk(ch,i);
  if(ch.type==='deduce') return renderDeduce(ch,i);
  if(ch.type==='twist'||ch.type==='story') return renderTwist(ch,i);
  return renderEnd(ch,i);
}

/* ---------- 啟動 ---------- */
function boot(){
  const local=loadLocal(); if(local) S=Object.assign(defaultState(),local);
  renderCoin();
  goCh(clamp(S.chMax||0,0,CHAPTERS.length-1));
  (async()=>{ try{ const cloud=await Account.load(); if(!cloud) return;
    if(progressScore(cloud)>progressScore(S)) S=Object.assign(defaultState(),cloud);
    mergeProgress(S,cloud); persist();
    goCh(clamp(S.chMax||0,0,CHAPTERS.length-1));
  }catch(e){} })();
}
boot();
// 測試接口
window.W=({ S:()=>S, ch:(i)=>goCh(i), chapters:()=>CHAPTERS, tones:()=>TONES, chars:()=>CHARS });
</script>
