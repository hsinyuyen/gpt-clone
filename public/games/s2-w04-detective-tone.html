<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>阿問偵探社・第四話：語氣變身術｜S2 W04</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  /* 調色盤／元件沿用 S2-W03《消失的慶典皇冠》，讓第四話跟前三話看起來是同一個系列 */
  :root{
    --bg:#0b1a2e; --bg2:#081422; --panel:#14304f; --panel2:#0f2540;
    --ink:#eef5ff; --ink2:#c3d6ef; --dim:#93b0d4; --line:#28517d;
    --gold:#ffcf5c; --amber:#ff9f43; --good:#4fe08a; --warn:#ff9f43;
    --card:var(--panel2);
    /* 四種語氣的顏色沿用 S2 系列的亮化色（深底上要夠高對比） */
    --t-warm:#3fc6dd; --t-serious:#b07dff; --t-funny:#ff9f43; --t-polite:#ff8fbb;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  /* ── 單頁式：一關＝一個畫面，整頁永遠不捲動 ──
     html/body 鎖高、body 當 flex 直欄，#stage 吃掉剩下的空間。
     用 100dvh 而不是 100vh：手機瀏覽器的網址列會伸縮，100vh 會算成
     比實際可視區還高，底下的按鈕就被推到看不到的地方。 */
  html,body{height:100%;overflow:hidden;}
  body{background:radial-gradient(120% 90% at 50% 0%,var(--bg2),var(--bg));color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.55;
    height:100dvh;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none;}
  /* 場景圖改當背景。原本是 width:100% 的區塊元素，桌機上一張 16:9 就吃掉約 500px 高，
     是要捲動的頭號原因；當背景則完全不佔版面，看起來也更像遊戲。 */
  #bg{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;
    opacity:.34;filter:saturate(.9);transition:opacity .35s;}
  #bg::after{content:'';position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(8,20,34,.5),rgba(8,20,34,.86));}
  #stage{flex:1 1 auto;min-height:0;width:100%;max-width:900px;margin:0 auto;padding:8px 16px 12px;
    display:flex;flex-direction:column;gap:8px;overflow:hidden;}
  /* 章節內的一個步驟。整頁不捲，但這裡留 overflow-y:auto 當安全閥——
     螢幕真的太矮時內容還是拿得到，不會有按不到的送出鍵。
     ⚠️ 不可以叫 .step：topbar 的「第 N / 18 章」標籤已經用了那個 class，
        撞名會把 flex/overflow 樣式套到標籤上，量測時也會抓錯元素。 */
  .pane{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:8px;overflow-y:auto;}
  .topbar{flex:0 0 auto;z-index:30;background:rgba(14,24,38,.94);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:7px 16px;display:flex;align-items:center;gap:12px;}
  .topbar .t{font-weight:900;font-size:15px;}
  .topbar .step{margin-left:auto;font-size:13px;color:var(--dim);font-weight:700;}
  .back{text-decoration:none;color:var(--dim);font-weight:700;font-size:13px;padding:5px 11px;
    border:1px solid var(--line);border-radius:999px;}
  /* 字級與間距整體收一階：要塞進一個畫面，但不能小到小三看不清楚（正文維持 16px 以上） */
  h1{font-size:clamp(19px,4.4vw,26px);font-weight:900;line-height:1.2;margin:0;}
  h2{font-size:clamp(17px,3.6vw,20px);font-weight:900;margin:0 0 4px;}
  p.lead{color:var(--dim);font-size:15.5px;margin-bottom:8px;}
  .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:2px solid var(--line);border-radius:16px;padding:11px 14px;margin:0;
    box-shadow:0 8px 26px rgba(0,0,0,.28);flex:0 0 auto;}
  .btn{display:inline-block;border:0;border-radius:16px;padding:12px 28px;font-size:clamp(16px,4.2vw,19px);font-weight:900;
    color:#08202f;cursor:pointer;font-family:inherit;background:linear-gradient(180deg,#ffe07a,var(--gold));
    box-shadow:0 6px 16px rgba(255,206,71,.28);}
  .btn:active{transform:translateY(1px);}
  .btn[disabled]{background:none;color:#6d8ba3;border:2px solid var(--line);box-shadow:none;cursor:not-allowed;}
  .btn.wide{display:block;width:100%;text-align:center;}
  .btn.ghost{background:none;color:var(--ink);border:2px solid var(--line);box-shadow:none;}
  /* 圖片：載不到就退成色塊，離線不開天窗（沿用 S2-W03 做法） */
  .img{width:100%;border-radius:14px;overflow:hidden;background:#20344c;}
  .img img{width:100%;display:block;}
  .img.fail{aspect-ratio:1/1;background:linear-gradient(140deg,#26405c,#1b2c42);}
  .img.fail img{display:none;}
  /* 語氣變身器 */
  .tones{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0;}
  .tone{background:linear-gradient(180deg,#16304f,#102540);border:2px solid var(--line);border-radius:14px;padding:8px 6px;cursor:pointer;
    text-align:center;font-family:inherit;color:var(--ink);transition:transform .1s,border-color .15s;}
  .tone:active{transform:translateY(1px);}
  .tone.on{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent);}
  /* ⚠️ 選 svg，不要選 .ic：toneIcon() 產生的 SVG 沒有 class，
     原本寫 .tone .ic 是死規則，圖示大小一直是 SVG 自己的 width/height 屬性說了算。 */
  .tone svg{display:block;width:34px;height:34px;margin:0 auto 3px;}
  .tone .nm{font-weight:900;font-size:15px;line-height:1.25;}
  .tone .use{font-size:11.5px;color:var(--dim);margin-top:1px;line-height:1.3;}
  .tone[disabled]{opacity:.45;cursor:not-allowed;}
  /* 角色立繪：放鬆／抗拒兩態 */
  .who{display:flex;gap:12px;align-items:flex-start;}
  /* 寬度同時受畫面高度限制（14vh）：矮螢幕上立繪自己縮，不用為每種尺寸手調數字 */
  .who .por{flex:0 0 auto;width:min(24vw,104px,14vh);}
  /* 立繪固定成 3:4 的框。每張角色圖去背後各自 trim 過，長寬比都不一樣，
     只固定寬度的話高度會因人而異——實測阿強、小華那兩關就是這樣多出 30px 撐破版面。
     contain 保證整個人都看得到，空白處露出框的底色。 */
  .who .por .img{border:3px solid var(--line);aspect-ratio:3/4;}
  .who .por .img img{height:100%;object-fit:contain;}
  .who.relaxed .por .img{border-color:var(--good);box-shadow:0 0 22px rgba(124,255,176,.35);}
  .who.resist .por .img{border-color:var(--warn);filter:saturate(.75) brightness(.9);}
  .who .say{flex:1;min-width:0;}
  .bubble{background:#1b2f47;border:1px solid var(--line);border-radius:16px;border-bottom-left-radius:4px;
    padding:9px 12px;font-size:16px;}
  .bubble+.bubble{margin-top:6px;}
  .bubble.ask{background:#173a52;border-color:rgba(124,208,255,.4);}
  .bubble.good{background:#14402f;border-color:rgba(124,255,176,.5);}
  .bubble.bad{background:#41231c;border-color:rgba(255,155,107,.5);}
  .mood{display:inline-block;font-size:12.5px;font-weight:800;color:var(--gold);
    border:1px solid var(--line);border-radius:999px;padding:2px 9px;margin-bottom:5px;}
  /* 語氣改寫打字 */
  .tpl{font-size:13.5px;color:var(--dim);margin:5px 0 3px;}
  textarea{width:100%;min-height:56px;border:1px solid var(--line);border-radius:12px;padding:9px 11px;
    background:#0d1a2a;color:var(--ink);font-family:inherit;font-size:16px;line-height:1.5;resize:none;
    -webkit-user-select:text;user-select:text;}
  .eg{font-size:13px;color:var(--dim);margin-top:4px;}
  .err{color:var(--warn);font-size:14px;font-weight:800;margin-top:5px;}
  /* 泡泡小考：漂浮泡泡＋防硬按。
     高度改成吃掉畫面剩下的空間（原本寫死 230px，配上其他卡片就會超出一頁）。 */
  .qs{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;}
  .qbs{position:relative;flex:1 1 auto;min-height:132px;margin:6px 0 0;}
  .qb{position:absolute;width:150px;height:150px;border-radius:50%;border:3px solid rgba(220,245,255,.85);
    background:radial-gradient(circle at 34% 30%,rgba(238,252,255,.99),rgba(152,216,255,.92) 70%,rgba(108,180,250,.72));
    color:#062a45;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:14px;cursor:pointer;transition:transform .12s;}
  .qb:active{transform:scale(.97);}
  .qbs.locked .qb{opacity:.55;cursor:not-allowed;}
  /* 線索板 */
  .clues{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin:6px 0 0;}
  .slot{background:#101f33;border:1px dashed var(--line);border-radius:12px;padding:7px 10px;min-height:0;
    font-size:14px;line-height:1.4;color:var(--dim);}
  .slot.got{border-style:solid;border-color:var(--good);color:var(--ink);background:#122c26;}
  /* 嫌疑人名冊：推理關把「昨晚在場的人＋他們的特徵」列出來，
     學生才有辦法把抽象線索（穿紅衣、有鑰匙）連到具體的人。 */
  .susp{display:flex;flex-direction:column;gap:5px;margin:5px 0 0;}
  .susp .row{display:flex;align-items:center;gap:10px;background:#101f33;border:1px solid var(--line);
    border-radius:12px;padding:5px 9px;}
  .susp .row .pic{flex:0 0 auto;width:40px;height:40px;border-radius:9px;overflow:hidden;background:#20344c;}
  .susp .row .pic img{width:100%;height:100%;object-fit:contain;}
  .susp .row .pic.fail img{display:none;}
  .susp .row .nm{flex:0 0 auto;font-weight:900;font-size:15px;min-width:2.6em;}
  .susp .row .tr{font-size:13.5px;color:var(--ink2);line-height:1.35;}
  .dlead{margin:6px 0 0;}
  .coin{position:fixed;right:12px;top:46px;z-index:25;background:rgba(14,24,38,.9);border:1px solid var(--line);
    border-radius:999px;padding:5px 12px;font-weight:900;color:var(--gold);font-size:13.5px;}
  .prog{height:6px;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden;margin:5px 0 0;}
  .prog>i{display:block;height:100%;background:var(--good);border-radius:999px;transition:width .3s;}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:60;background:rgba(8,20,34,.95);
    border:1px solid var(--good);color:var(--good);border-radius:999px;padding:10px 20px;font-weight:900;}
  .zh{font-size:.62em;color:var(--dim);}
  /* 開發用跳關列：只在 localhost 或網址帶 ?dev=1 時顯示，學生看不到。 */
  #dev{position:fixed;left:8px;bottom:8px;z-index:100;display:none;align-items:center;gap:6px;
    background:rgba(8,20,34,.94);border:1px solid var(--amber);border-radius:999px;padding:5px 10px;
    font-size:12px;color:var(--amber);box-shadow:0 4px 14px rgba(0,0,0,.4);}
  #dev.on{display:flex;}
  #dev button{border:1px solid var(--amber);background:none;color:var(--amber);border-radius:8px;
    font-weight:900;font-size:13px;line-height:1;padding:4px 9px;cursor:pointer;font-family:inherit;}
  #dev button:active{transform:translateY(1px);}
  #dev input{width:40px;background:#0d1a2a;border:1px solid var(--line);color:var(--ink);
    border-radius:6px;padding:3px 4px;font-size:12px;text-align:center;font-family:inherit;
    -webkit-user-select:text;user-select:text;}
  #dev .lb{font-weight:800;min-width:8.5em;text-align:center;}
  /* ── 矮又寬（手機橫放）：改成左右並排 ──
     這種尺寸只剩約 330px 可用高度，直排怎麼縮都塞不下，而小三的字級不該再縮。
     好在每個畫面剛好都是兩張卡（劇情/角色 ＋ 小考/操作），並排就把高度砍半。 */
  @media (max-height:620px) and (min-aspect-ratio:13/10){
    .pane{flex-direction:row;align-items:stretch;}
    .pane>.card{flex:1 1 0;min-width:0;overflow-y:auto;}
    .who{flex-direction:column;align-items:center;gap:7px;}
    .who .por{width:min(17vh,84px);}
    .who .say{width:100%;}
    h1{font-size:17px;}
    h2{font-size:15px;}
    .card{padding:9px 11px;}
    /* 操作卡最擠：語氣鈕的說明字收掉（各關標題已經講了什麼時候用哪種語氣），
       圖示與打字框也縮一階。填空模板與例句要留著——那是小三真正需要的鷹架。 */
    .tone .use{display:none;}
    .tone svg{width:26px;height:26px;margin-bottom:2px;}
    .tone .nm{font-size:14px;}
    .tone{padding:6px 4px;}
    .tones{gap:6px;margin:4px 0;}
    textarea{min-height:42px;}
    .eg,.tpl{font-size:12px;line-height:1.3;margin:3px 0 0;}
    .err{margin-top:3px;font-size:12.5px;}
    .bubble{padding:6px 9px;font-size:13.5px;line-height:1.35;}
    .bubble+.bubble{margin-top:4px;}
    .btn{padding:9px 20px;font-size:16px;}
    .clues{grid-template-columns:repeat(4,1fr);}  /* 結局的 8 條線索改排四欄 */
    .slot{font-size:12.5px;padding:5px 8px;}
    /* 推理關的嫌疑人名冊：橫排太矮塞不下三列＋頭像，改成頭像縮小、字收一階、間距壓緊 */
    .susp{gap:3px;margin:3px 0 0;}
    .susp .row{padding:2px 8px;gap:8px;}
    .susp .row .pic{width:26px;height:26px;}
    .susp .row .nm{font-size:13px;}
    .susp .row .tr{font-size:11.5px;line-height:1.2;}
    .dlead{margin:2px 0 0;font-size:11.5px;line-height:1.25;}
    /* 推理關的線索格與標題在橫排再收一點，把名冊擠得下 */
    .pane .clues{gap:5px;}
    .pane .slot{padding:3px 7px;font-size:12px;}
  }
</style>

<body>
<div id="bg"></div>
<div class="topbar">
  <a class="back" href="/worksheets">← 返回</a>
  <span class="t">阿問偵探社・第四話：語氣變身術</span>
  <span class="step" id="stepTag"></span>
</div>
<div class="coin" id="coinHud">🪙 0</div>
<div id="stage"></div>
<div id="overlay"></div>

<script>
/* =========================================================================
   S2-W04《阿問偵探社・第四話：語氣變身術 — 被搞砸的園遊會》
   學習核心＝語氣控制：對不同的人用對的語氣，他才願意開口。
   兩幕：第一幕用 4 種語氣問 4 個人找出「是誰」→ 翻轉（他是好意）→
         第二幕用同 4 種語氣換情境再問 4 個人，找出「為什麼」並和解。
   引擎（DOM 單檔 / 存檔綁 uid / 金幣冪等 / 防硬按泡泡題）沿用 S2-W03 chassis。
   每一段之後都接互動確認，沒有純「繼續」的頁面。
   ========================================================================= */
const stage=document.getElementById('stage');
const $=(s,r)=>(r||document).querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const now=()=>performance.now();
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
/* 語氣改寫一律要自己打字。
   照著回饋裡的範例句重打一遍沒關係——那也是練習；但複製貼上就完全沒練到。
   paste 事件涵蓋 Ctrl+V、右鍵貼上、長按貼上；拖曳文字進來是另一條路，所以 drop 也要擋。
   要在 ta 進 DOM 之後才呼叫（提示訊息是插在它後面）。 */
function noPaste(ta){
  const warn=el('div','err','這句要自己打喔，不能貼上。');
  warn.style.display='none';
  ta.insertAdjacentElement('afterend',warn);
  let t=null;
  const block=(e)=>{
    e.preventDefault();
    warn.style.display='';
    clearTimeout(t); t=setTimeout(()=>{warn.style.display='none';},2400);
  };
  ta.addEventListener('paste',block);
  ta.addEventListener('drop',block);
  return ta;
}
// 圖片載不到就退成色塊，離線也不會開天窗（沿用 S2-W03）
function pic(name,cls){const w=el('div','img'+(cls?' '+cls:''));const im=document.createElement('img');
  im.src='assets/'+name+(/\.(png|jpe?g|webp)$/i.test(name)?'':'.png');im.alt='';im.onerror=()=>w.classList.add('fail');
  w.appendChild(im);return w;}

/* ---------- 音效（程序化，不用音檔） ---------- */
const Sfx=(()=>{let ac=null;function ctx(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();}catch(e){}return ac;}
  function tone(f,d,t,v){const a=ctx();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=t||'sine';o.frequency.value=f;
    g.gain.setValueAtTime(0,a.currentTime);g.gain.linearRampToValueAtTime(v||.06,a.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+(d||.15));o.connect(g);g.connect(a.destination);
    o.start();o.stop(a.currentTime+(d||.15));}
  return {tick(){tone(430,.05,'triangle',.05);},ding(){tone(880,.12,'sine',.06);setTimeout(()=>tone(1320,.14,'sine',.05),70);},
    pop(){tone(260,.12,'square',.05);},bad(){tone(180,.2,'sawtooth',.05);},
    win(){[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,.17,'square',.05),i*95));},resume(){ctx();}};
})();

/* ---------- 帳號綁定（gameKey s2w04 獨立存檔；coins/{uid} 錢包與全系列共用） ---------- */
const GAMEKEY='s2w04';
/* 金幣：規格 §1 的課綱是 35。拆法要剛好加到 35，否則學習單列表會顯示對不起來的數字。
   給幣的章節＝前情提要 2 ＋ 語氣教學 4 ＋ 訪談 8 ＋ 翻轉 1 ＝ 15 章 ×2 ＝ 30
   ＋ 兩幕推理各 2 ＝ 4 ＋ 破案 1 ＝ 35。小老師另計 17（約任務的 50%，CLAUDE.md §21）。 */
const COIN_PER_CH=2, COIN_ACT=2, COIN_DONE=1, COIN_TA=17;
const TOTAL_COINS=35+COIN_TA;   // 52
const FB={apiKey:"AIzaSyDVnab3BCfnlJH5cRCz_EqaHlP7yQUpK78",authDomain:"gpt-clone-68b9f.firebaseapp.com",projectId:"gpt-clone-68b9f",storageBucket:"gpt-clone-68b9f.firebasestorage.app",messagingSenderId:"436942056069",appId:"1:436942056069:web:8762675dfff7b7e92017ec"};
const Account=(()=>{let uid=null,uname='',db=null,ready=false;
  function su(){try{const r=(sessionStorage.getItem('@session/currentUser')||localStorage.getItem('@session/currentUser'));return r?JSON.parse(r):null;}catch(e){return null;}}
  function init(){const u=su();if(u&&u.id){uid=u.id;uname=u.displayName||u.username||'';}
    if(uid&&window.firebase){try{if(!firebase.apps.length)firebase.initializeApp(FB);db=firebase.firestore();ready=true;}catch(e){}}}
  async function load(){if(!ready)return null;try{const s=await db.collection('gameProgress').doc(uid).get();return s.exists?(s.data()[GAMEKEY]||null):null;}catch(e){return null;}}
  async function save(state){if(!ready)return;try{await db.collection('gameProgress').doc(uid).set({[GAMEKEY]:state,name:uname,updatedAt:new Date().toISOString()},{merge:true});}catch(e){}}
  async function creditCoins(id,amount,reason){if(!ready||!(amount>0))return;const ref=db.collection('coins').doc(uid);
    try{await db.runTransaction(async tx=>{const s=await tx.get(ref);const c=s.exists?s.data():{balance:0,totalEarned:0,transactions:[]};
      const txs=Array.isArray(c.transactions)?c.transactions:[];
      if(txs.some(t=>t&&t.id===id))return;                       // 冪等：同一個 id 只入帳一次
      txs.push({id,amount,reason,timestamp:new Date().toISOString()});
      tx.set(ref,{balance:(c.balance||0)+amount,totalEarned:(c.totalEarned||0)+amount,transactions:txs.slice(-160)});});}catch(e){}}
  return {init,load,save,creditCoins,get ready(){return ready;},get uid(){return uid;},get name(){return uname;}};
})();

function overallPct(){ return S.done?1:clamp(S.chMax/CHAPTERS.length,0,1); }
function persist(){ S.pct=overallPct(); try{ localStorage.setItem(SKEY,JSON.stringify(S)); }catch(e){} Account.save(S); }

/* 雲端／本機哪一份比較遠：先比是否破案，再比進度，可增不可減的欄位取聯集 */
function progressScore(s){ return s? (s.done?1e6:0)+(s.chMax||0)*10+Object.keys(s.clues||{}).length : -1; }
function mergeProgress(dst,other){ if(!dst||!other) return dst;
  dst.chMax=Math.max(dst.chMax||0,other.chMax||0);
  dst.coins=Math.max(dst.coins||0,other.coins||0);
  dst.done=!!(dst.done||other.done); dst.ta=!!(dst.ta||other.ta);
  dst.clues=Object.assign({},other.clues||{},dst.clues||{});
  return dst; }

/* 自繪語氣圖示（規格要求非 emoji） */
function toneIcon(k,size){
  const s=size||44, ns='http://www.w3.org/2000/svg';
  const sv=document.createElementNS(ns,'svg'); sv.setAttribute('viewBox','0 0 48 48');
  sv.setAttribute('width',s); sv.setAttribute('height',s);
  const col=getComputedStyle(document.documentElement).getPropertyValue('--t-'+
    (k==='warm'?'warm':k==='serious'?'serious':k==='funny'?'funny':'polite')).trim()||'#fff';
  const c=document.createElementNS(ns,'circle'); c.setAttribute('cx',24); c.setAttribute('cy',24);
  c.setAttribute('r',20); c.setAttribute('fill','none'); c.setAttribute('stroke',col); c.setAttribute('stroke-width',3);
  sv.appendChild(c);
  const mk=(d,w)=>{const p=document.createElementNS(ns,'path');p.setAttribute('d',d);p.setAttribute('fill','none');
    p.setAttribute('stroke',col);p.setAttribute('stroke-width',w||3);p.setAttribute('stroke-linecap','round');sv.appendChild(p);};
  const eye=(x,y,r)=>{const e=document.createElementNS(ns,'circle');e.setAttribute('cx',x);e.setAttribute('cy',y);
    e.setAttribute('r',r||2.4);e.setAttribute('fill',col);sv.appendChild(e);};
  if(k==='warm'){    eye(17,21); eye(31,21); mk('M16 30 Q24 35 32 30'); }           // 微笑
  if(k==='serious'){ mk('M14 20 L21 20',3); mk('M27 20 L34 20',3); mk('M17 31 L31 31'); } // 平嘴
  if(k==='funny'){   mk('M14 19 Q17 15 20 19'); mk('M28 19 Q31 15 34 19'); mk('M15 28 Q24 38 33 28'); } // 大笑
  // ⚠️ SVG 的 y 往下增加：控制點的 y 要比端點「大」才會往下彎成笑臉。
  //    第一版寫成 Q24 28（比端點的 33 小）＝往上彎＝苦臉，實際畫面上看起來像在難過。
  if(k==='polite'){  eye(17,20); eye(31,20); mk('M14 31 Q24 37 34 31'); mk('M24 8 L24 13'); } // 微笑＋點頭
  return sv;
}

/* =========================================================================
   語氣審核：交給 AI 判斷「整句話有沒有那個語氣」，而不是比對關鍵字。
   關鍵字做不到這件事——
     「我沒關係啦你快講」有「沒關係」卻在催人；
     「你先深呼吸，等你準備好再說」一個關鍵字都沒有卻很溫柔。
   ⚠️ AI 連不上或逾時 → 退回本地關鍵字判定。規格 §6 要求離線可用、載入逾時放行，
      不能因為後端掛了就把學生卡在那一關。
   ========================================================================= */
function localReview(toneKey,txt){
  const T=TONES[toneKey];
  if(txt.length<6) return {passed:false,feedback:'句子太短了，照上面的模板寫一句完整的話。'};
  const bad=T.bad.find(w=>txt.includes(w));
  if(bad) return {passed:false,feedback:'「'+bad+'」不太像「'+T.name+'」喔，換個說法。'};
  if(!T.ok.some(w=>txt.includes(w)))
    return {passed:false,feedback:'還不夠「'+T.name+'」。試著用上：'+T.ok.slice(0,3).join('、')};
  return {passed:true,feedback:'這句很「'+T.name+'」！'};
}
async function reviewTone(toneKey,txt,target,mood){
  const T=TONES[toneKey];
  // 太短或亂打先本地擋掉，不用浪費一次 API 來回
  if(txt.length<6) return {passed:false,feedback:'句子太短了，照上面的模板寫一句完整的話。',by:'local'};
  try{
    const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),10000); // 逾時 10s → 放行給本地
    const r=await fetch('/api/review-tone',{ method:'POST', signal:ctl.signal,
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ tone:T.name, toneUse:T.use, target:target||'', targetMood:mood||'', sentence:txt }) });
    clearTimeout(to);
    if(!r.ok) throw new Error('http '+r.status);
    const j=await r.json();
    if(typeof j.passed!=='boolean') throw new Error('bad shape');
    return { passed:j.passed, feedback:j.feedback||(j.passed?'很好！':'再想想語氣。'), by:'ai' };
  }catch(e){
    const lo=localReview(toneKey,txt); lo.by='local'; return lo;
  }
}
/* =========================================================================
   單頁式畫面控制
   一關就是一個畫面，整頁不捲動。原本會捲的兩個原因都在這裡處理掉：
   ① 場景圖是 width:100% 的區塊 → 改成 setScene() 畫在背景層，不佔版面。
   ② 章節內容往下疊 → 改成 screen() 換掉整個畫面。
      （最明顯的是訪談過關後又長出「線索到手＋線索板＋小考」三張卡。）
   所以也不再需要「自動捲到下一題」——下一題本來就在眼前。
   ========================================================================= */
const bgEl=document.getElementById('bg');
function setScene(name){
  bgEl.style.backgroundImage = name ? "url('assets/"+name+".jpg')" : '';
}
/* 開一個新的步驟畫面：清空舞台、放上標題與進度列，回傳可以塞內容的容器。
   同一章的第二步（例如訪談過關後的線索＋小考）也是呼叫這支，換掉而不是接在後面。 */
/* 畫面換掉時要解除的監聽（例如泡泡題的 resize）。
   不收的話每換一關就多疊一組，而且會對著已經被清掉的節點做事。 */
let teardown=[];
function onScreenExit(fn){ teardown.push(fn); }
function screen(ch,i){
  teardown.forEach(fn=>{ try{ fn(); }catch(e){} }); teardown=[];
  stage.innerHTML='';
  stage.appendChild(header(ch,i));
  const s=el('div','pane');
  stage.appendChild(s);
  return s;
}

   suspects:[

     { name:'阿強', img:'s2w04-qiang',  tr:'穿藍色運動服、昨天沒有鑰匙' },

 { type:'twist', title:'咦？他好像不是壞人', scene:'s2w04-rain',
   intro:'你們找到小華，正要怪他——',

 { type:'talk', act:2, who:'hua', title:'幕二・怕被罵的小華', scene:'s2w04-rain',

 { type:'talk', act:2, who:'blamed', title:'幕二・被怪罪的同學', scene:'s2w04-stall',
   clue:{ id:'nofault', text:'被怪的同學其實沒做' },
   quiz:{ q:'要讓生氣的人聽進道理，用什麼語氣？', opts:['認真','搞笑','溫柔'], a:0 } },
 { type:'talk', act:2, who:'sister2', title:'幕二・再問小妹妹', scene:'s2w04-corner',
   clue:{ id:'hug', text:'有人看到他抱著招牌躲雨' },
   quiz:{ q:'小妹妹補充了什麼？', opts:['他抱著招牌躲雨','他把招牌丟掉','他在哭'], a:0 } },
 { type:'talk', act:2, who:'janitor', title:'幕二・校工阿伯', scene:'s2w04-yard',
   clue:{ id:'rain', text:'昨晚真的下大雨' },
   quiz:{ q:'校工阿伯證實了什麼？', opts:['昨晚真的下大雨','昨晚有小偷','昨晚停電'], a:0 } },

 { type:'deduce', act:2, title:'幕二・還原真相', scene:'s2w04-board',
   need:['why','rain','hug','nofault'],

 { type:'end', title:'大家和好了', scene:'s2w04-end' },
];
const CLUE_TEXT={}; CHAPTERS.forEach(c=>{ if(c.clue) CLUE_TEXT[c.clue.id]=c.clue.text; });

/* ---------- 進度列 ---------- */
function header(ch,i){
  const w=el('div'); const t=el('h1',null,ch.title); w.appendChild(t);
  const p=el('div','prog'); const b=el('i'); b.style.width=Math.round(i/CHAPTERS.length*100)+'%';
  p.appendChild(b); w.appendChild(p);
  $('#stepTag').textContent='第 '+(i+1)+' / '+CHAPTERS.length+' 章';
  return w; }

/* =========================================================================
   泡泡小考：三顆漂浮泡泡，點錯鎖 2＋N 秒並重洗位置（防硬按）。
   答對才會進下一段——沒有純「繼續」。
   ========================================================================= */
function bubbleQuiz(host,q,onPass){
  const box=el('div','card qs');            // qs＝吃掉畫面剩下的高度，泡泡才不會撐破一頁
  box.appendChild(el('h2',null,'考考你'));
  box.appendChild(el('p','lead',q.q));
  const wrap=el('div','qbs'); box.appendChild(wrap);
  const msg=el('div','err'); box.appendChild(msg);
  host.appendChild(box);
  let wrongN=0, lockUntil=0, solved=false;
  const opts=shuffle(q.opts.map((t,i)=>({t,ok:i===q.a})));
  function layout(){
    wrap.innerHTML='';
    /* 泡泡大小同時受寬與高限制。只看寬度的話，在矮螢幕上泡泡會比容器還高而被裁掉。
       容器高度要等版面算完才有值，所以拿不到就先用 190 當保守值。 */
    const cols=wrap.clientWidth||600, rows=wrap.clientHeight||190;
    const size=Math.round(clamp(Math.min(cols/3.4,rows*0.82),86,150));
    shuffle(opts).forEach((o,i)=>{
      const b=el('button','qb',o.t);
      b.style.width=b.style.height=size+'px';
      b.style.left=Math.round(i*(cols-size)/Math.max(1,opts.length-1))+'px';
      b.style.top=Math.round(Math.random()*Math.max(0,rows-size))+'px';
      b.onclick=()=>{
        if(now()<lockUntil){ Sfx.pop(); return; }
        if(o.ok){ Sfx.ding(); solved=true; msg.style.color='var(--good)'; msg.textContent='答對了！';
          wrap.querySelectorAll('.qb').forEach(x=>x.disabled=true);
          setTimeout(onPass,650); }
        else{ Sfx.bad(); wrongN++; lockUntil=now()+2000+(wrongN-1)*1000;
          msg.style.color='var(--warn)';
          msg.textContent='再想想～ 等一下下（'+Math.round((lockUntil-now())/1000)+' 秒）';
          wrap.classList.add('locked');
          const tk=setInterval(()=>{ const left=Math.ceil((lockUntil-now())/1000);
            if(left<=0){ clearInterval(tk); wrap.classList.remove('locked'); msg.textContent=''; layout(); }
            else msg.textContent='再想想～ 等一下下（'+left+' 秒）'; },250); }
      };
      wrap.appendChild(b);
    });
  }
  layout();
  /* 轉螢幕／改視窗大小時泡泡要重排，否則會跑到容器外面。
     已經答對或正在罰站倒數時不重排——會把鎖定狀態洗掉。 */
  const onResize=()=>{ if(!solved && now()>=lockUntil) layout(); };
  addEventListener('resize',onResize);
  onScreenExit(()=>removeEventListener('resize',onResize));
  return box;
}

/* ---------- 線索板 ----------
   拆成「格線」與「整張卡」兩支：單頁式要盡量少一張卡，
   所以線索格常常是嵌在別的卡裡（例如「線索到手」那一步），而不是自己佔一張。 */
function clueGrid(needIds){
  const g=el('div','clues');
  (needIds||Object.keys(CLUE_TEXT)).forEach(id=>{
    const got=!!S.clues[id];
    g.appendChild(el('div','slot'+(got?' got':''), got?CLUE_TEXT[id]:'？（還沒問到）'));
  });
  return g;
}
function clueBoard(host,needIds){
  const box=el('div','card');
  box.appendChild(el('h2',null,'線索板'));
  box.appendChild(clueGrid(needIds));
  host.appendChild(box);
  return box;
}

/* =========================================================================
   訪談引擎（8 章共用）
   讀狀況 → 選語氣 → 自己打一句該語氣的話（內容驗證）→ 看對方反應
   → 選對才給線索、選錯換語氣或改句子再試（非致命）→ 線索上板 → 互動確認
   ========================================================================= */
function renderTalk(ch,i){
  setScene(ch.scene);                       // 場景走背景層，不佔版面
  const s=screen(ch,i);
  const who=CHARS[ch.who];

  const card=el('div','card');
  const row=el('div','who'); row.id='whoRow';
  const por=el('div','por'); por.appendChild(pic(who.img)); row.appendChild(por);
  const say=el('div','say');
  say.appendChild(el('div','mood','他現在的樣子'));
  say.appendChild(el('div','bubble',who.mood));
  const reply=el('div'); reply.id='reply'; say.appendChild(reply);
  row.appendChild(say); card.appendChild(row); s.appendChild(card);

  // 語氣變身器
  const tc=el('div','card');
  tc.appendChild(el('h2',null,'語氣變身器'));
  const tg=el('div','tones');
  let picked=null;
  TONE_KEYS.forEach(k=>{
    const T=TONES[k], b=el('button','tone'); b.style.setProperty('--c',T.col);
    b.appendChild(toneIcon(k));
    b.appendChild(el('div','nm',T.name));
    b.appendChild(el('div','use',T.use));
    b.onclick=()=>{ picked=k; Sfx.tick();
      [...tg.children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
      tpl.textContent='填空模板：'+T.tpl; eg.textContent='例如：'+T.eg; err.textContent='';
      ta.placeholder='用「'+T.name+'」的語氣打一句話…'; ta.focus(); };
    tg.appendChild(b);
  });
  tc.appendChild(tg);
  const tpl=el('div','tpl','先選一個語氣'); tc.appendChild(tpl);
  const ta=el('textarea'); ta.placeholder='先選一個語氣，再打一句話…'; tc.appendChild(ta); noPaste(ta);
  const eg=el('div','eg'); tc.appendChild(eg);
  const err=el('div','err'); tc.appendChild(err);
  const send=el('button','btn wide','叫阿問這樣去問'); tc.appendChild(send);
  s.appendChild(tc);

  send.onclick=async()=>{
    Sfx.resume();
    if(!picked){ err.style.color='var(--warn)'; err.textContent='先選一種語氣喔。'; return; }
    const T=TONES[picked], txt=(ta.value||'').trim();
    // 內容驗證交給 AI（阿問看得懂整句的感覺，不是比對關鍵字）；連不上就退回本地判定
    send.disabled=true; const label=send.textContent; send.textContent='阿問正在看…';
    err.style.color='var(--dim)'; err.textContent='';
    const v=await reviewTone(picked, txt, who.name, who.mood);
    send.textContent=label; send.disabled=false;
    if(!v.passed){ err.style.color='var(--warn)'; err.textContent=v.feedback; Sfx.pop(); return; }
    err.textContent='';
    // 通過驗證 → 對方按「這個語氣對不對」給出反應
    const good=(picked===who.tone);
    reply.innerHTML='';
    reply.appendChild(el('div','mood',good?'他放鬆了':'他更抗拒了'));
    reply.appendChild(el('div','bubble '+(good?'good':'bad'), who.react[picked]));
    row.classList.remove('relaxed','resist'); row.classList.add(good?'relaxed':'resist');
    if(good){
      Sfx.ding();
      S.clues[ch.clue.id]=true;
      addCoins('ch'+i, COIN_PER_CH, 'S2-W04 第'+(i+1)+'章');
      send.disabled=true; ta.disabled=true;
      [...tg.children].forEach(x=>x.disabled=true);
      // 讓學生先看到對方鬆口的反應，再換到「線索到手」那一步
      setTimeout(()=>talkResult(ch,i),1200);
    } else {
      Sfx.bad();
      err.textContent='他更不想說了。換一種語氣，或把句子改一下再試——不會被扣分。';
    }
  };
}
/* 訪談的第二步：線索到手＋小考。整個換掉第一步的畫面，不是接在它下面。
   線索格直接嵌進「線索到手」這張卡，省下一張卡的高度（單頁式要斤斤計較）。 */
function talkResult(ch,i){
  const s=screen(ch,i);
  const c=el('div','card');
  c.appendChild(el('h2',null,'線索到手'));
  c.appendChild(el('div','bubble good',ch.clue.text));
  c.appendChild(clueGrid(CHAPTERS.filter(x=>x.clue&&x.act===ch.act).map(x=>x.clue.id)));
  s.appendChild(c);
  bubbleQuiz(s, ch.quiz, ()=>goCh(i+1));
}

/* ---------- 章0：語氣教學。一關只教一種語氣、只打一句話 ---------- */
function renderTone0(ch,i){
  setScene(ch.scene);
  const s=screen(ch,i);
  const T=TONES[ch.tone];
  const c1=el('div','card');
  c1.appendChild(el('div','bubble',ch.intro));
  c1.appendChild(el('div','bubble ask',ch.intro2));
  s.appendChild(c1);

  const c2=el('div','card');
  // 這一關只顯示這一種語氣（其餘三種要等各自的關卡），版面不會又是四選一
  const head=el('div','tones'); head.style.gridTemplateColumns='1fr';
  const chip=el('div','tone on'); chip.style.setProperty('--c',T.col);
  chip.appendChild(toneIcon(ch.tone,52));
  chip.appendChild(el('div','nm',T.name));
  chip.appendChild(el('div','use','什麼時候用：'+T.use));
  head.appendChild(chip); c2.appendChild(head);

  c2.appendChild(el('div','tpl','填空模板：'+T.tpl));
  const ta=el('textarea'); ta.placeholder='用「'+T.name+'」的語氣打一句話…'; c2.appendChild(ta); noPaste(ta);
  c2.appendChild(el('div','eg','例如：'+T.eg));
  const err=el('div','err'); c2.appendChild(err);
  const ok=el('button','btn wide','這句可以'); c2.appendChild(ok);
  s.appendChild(c2);
  setTimeout(()=>ta.focus(),100);

  ok.onclick=async()=>{
    Sfx.resume();
    const txt=(ta.value||'').trim();
    ok.disabled=true; const label=ok.textContent; ok.textContent='阿問正在看…';
    err.style.color='var(--dim)'; err.textContent='';
    const v=await reviewTone(ch.tone, txt);
    ok.textContent=label;
    if(!v.passed){ ok.disabled=false; err.style.color='var(--warn)'; err.textContent=v.feedback; Sfx.pop(); return; }
    Sfx.ding(); err.style.color='var(--good)'; err.textContent=v.feedback;
    ta.disabled=true;
    addCoins('ch'+i, COIN_PER_CH, 'S2-W04 '+T.name+'練習');
    // 讓學生讀完阿問的肯定，再換到小考那一步（換畫面，不往下疊）
    setTimeout(()=>{
      const s2=screen(ch,i);
      const done=el('div','card');
      done.appendChild(el('h2',null,'「'+T.name+'」學會了'));
      done.appendChild(el('div','bubble good',v.feedback));
      s2.appendChild(done);
      bubbleQuiz(s2, ch.quiz, ()=>goCh(i+1));
    },1400);
  };
}

/* ---------- 翻轉／推理／結局 ---------- */
function renderTwist(ch,i){
  setScene(ch.scene);
  const s=screen(ch,i);
  const c=el('div','card');
  // 支援多句敘述（案件前情要講清楚）；沒給 lines 就沿用舊的 intro/intro2 兩句。
  // 最後一句用 ask 樣式（藍框），當成「阿問給你的任務／提問」。
  const lines=ch.lines||[ch.intro,ch.intro2];
  lines.forEach((t,k)=> c.appendChild(el('div','bubble'+(k===lines.length-1?' ask':''), t)));
  s.appendChild(c);
  bubbleQuiz(s, ch.quiz, ()=>{ addCoins('ch'+i,COIN_PER_CH,'S2-W04 前情/翻轉'); goCh(i+1); });
}
function suspectRoster(list){
  const box=el('div','susp');
  list.forEach(su=>{
    const row=el('div','row');
    const p=pic(su.img); p.classList.remove('img'); p.classList.add('pic');  // 借用 pic() 的載入退色塊，但套名冊的小框
    row.appendChild(p);
    row.appendChild(el('div','nm',su.name));
    row.appendChild(el('div','tr',su.tr));
    box.appendChild(row);
  });
  return box;
}
function renderDeduce(ch,i){
  setScene(ch.scene);
  const s=screen(ch,i);
  const c=el('div','card');
  c.appendChild(el('h2',null,'先把線索攤開'));
  c.appendChild(clueGrid(ch.need));         // 線索格嵌進同一張卡
  // 有嫌疑人名冊的推理關（第一幕「是誰」）：把在場的人＋特徵列出來，
  // 學生才能把線索比對到具體的人，而不是硬猜一個沒見過的名字。
  // 名冊接在同一張卡內（不另開卡）——直排時省下一張卡的內距與間距。
  if(ch.suspects){
    if(ch.lead) c.appendChild(el('p','lead dlead',ch.lead));  // 用 class 才能被橫排 media query 收窄（inline 樣式會蓋過）
    c.appendChild(suspectRoster(ch.suspects));
  }
  s.appendChild(c);
  bubbleQuiz(s, ch.quiz, ()=>{ addCoins('act'+ch.act,COIN_ACT,'S2-W04 第'+ch.act+'幕破案'); goCh(i+1); });
}
function renderEnd(ch,i){
  setScene(ch.scene);
  const s=screen(ch,i);
  if(!S.done){ S.done=true; addCoins('done',COIN_DONE,'S2-W04 破案'); }
  const c=el('div','card');
  c.appendChild(el('h2',null,'最會好好說話的偵探'));
  c.appendChild(el('div','bubble good','你學到的事：同一句話，換個語氣，對方肯不肯講差很多。'));
  c.appendChild(clueGrid(Object.keys(CLUE_TEXT)));
  s.appendChild(c);
  const c2=el('div','card');
  const ta=el('button','btn wide', S.ta?'已經當過小老師':'我是小偵探學長');
  ta.disabled=!!S.ta;
  ta.onclick=()=>{ S.ta=true; ta.disabled=true; ta.textContent='已經當過小老師';
    addCoins('ta',COIN_TA,'S2-W04 小老師');
    toast('去教一位同學：怎麼看對方的情緒選語氣！'); };
  c2.appendChild(ta);
  const home=el('button','btn ghost wide','回學習單'); home.style.marginTop='8px';
  home.onclick=()=>{ location.href='/worksheets'; };
  c2.appendChild(home);
  s.appendChild(c2);
}
function toast(msg){ const t=el('div','toast',msg); document.body.appendChild(t);
  setTimeout(()=>t.remove(),2600); }

/* ---------- 開發用跳關列 ----------
   只在 localhost 或網址帶 ?dev=1 時出現；學生的正式網址看不到。
   直接呼叫 goCh() 任意跳關，方便測試每一關的畫面與流程。 */
const DEV = location.hostname==='localhost' || location.hostname==='127.0.0.1'
         || /[?&]dev=1\b/.test(location.search);
let devLb=null;
function buildDev(){
  if(!DEV) return;
  const d=document.getElementById('dev'); if(!d) return;
  const prev=el('button',null,'◀'), next=el('button',null,'▶'), go=el('button',null,'跳');
  devLb=el('span','lb');
  const jump=document.createElement('input'); jump.type='number'; jump.min=0; jump.max=CHAPTERS.length-1;
  prev.onclick=()=>goCh(clamp((S.ch||0)-1,0,CHAPTERS.length-1));
  next.onclick=()=>goCh(clamp((S.ch||0)+1,0,CHAPTERS.length-1));
  const doJump=()=>{ const v=parseInt(jump.value,10); if(!isNaN(v)) goCh(clamp(v,0,CHAPTERS.length-1)); };
  go.onclick=doJump; jump.addEventListener('keydown',e=>{ if(e.key==='Enter') doJump(); });
  d.append(el('span','lb','DEV'), prev, devLb, next, jump, go);
  d.classList.add('on');
}
function refreshDev(i,ch){ if(devLb) devLb.textContent=i+'/'+(CHAPTERS.length-1)+'・'+ch.title; }

/* ---------- 流程控制 ---------- */
function goCh(i){
  if(i>=CHAPTERS.length) i=CHAPTERS.length-1;
  S.ch=i; if(i>S.chMax) S.chMax=i;
  persist(); renderCoin();
  const ch=CHAPTERS[i];
  refreshDev(i,ch);
  if(ch.type==='tone0')  return renderTone0(ch,i);
  if(ch.type==='talk')   return renderTalk(ch,i);
  if(ch.type==='deduce') return renderDeduce(ch,i);
  if(ch.type==='twist'||ch.type==='story') return renderTwist(ch,i);
  return renderEnd(ch,i);
}

/* ---------- 啟動 ---------- */
function boot(){
  buildDev();
  const local=loadLocal(); if(local) S=Object.assign(defaultState(),local);
  renderCoin();
  goCh(clamp(S.chMax||0,0,CHAPTERS.length-1));
  (async()=>{ try{ const cloud=await Account.load(); if(!cloud) return;
    if(progressScore(cloud)>progressScore(S)) S=Object.assign(defaultState(),cloud);
    mergeProgress(S,cloud); persist();
    goCh(clamp(S.chMax||0,0,CHAPTERS.length-1));
  }catch(e){} })();
}
boot();
// 測試接口
window.W=({ S:()=>S, ch:(i)=>goCh(i), chapters:()=>CHAPTERS, tones:()=>TONES, chars:()=>CHARS });
